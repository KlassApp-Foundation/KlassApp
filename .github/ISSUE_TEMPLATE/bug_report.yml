name: Bug report
description: Something is broken or wrong in KlassApp
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Be specific. Real steps and evidence beat vague "it doesn't work" reports.
        Security vulnerabilities: email **community@klassapp.xyz** instead (see `SECURITY.md`). Do not file them here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? What did you expect instead?
      placeholder: When I open… I see… I expected…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps someone else can follow.
      placeholder: |
        1. Go to…
        2. Click…
        3. See error…
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Landing / marketing
        - Login / register
        - Admin dashboard
        - Manual onboarding wizard
        - Toshi
        - Teacher
        - Parent / WhatsApp
        - Other
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production (klassapp.xyz)
        - Staging
        - Local
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, HTTP status, log snippets, browser console errors. Redact secrets and real student data.
    validations:
      required: false
  - type: input
    id: school-context
    attributes:
      label: School / account context (optional)
      description: Demo school name or role only. Never paste real student PII.
    validations:
      required: false
