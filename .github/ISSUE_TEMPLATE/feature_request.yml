name: Feature request
description: Propose a change or addition to KlassApp
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the idea. Small, concrete requests are easier to ship than large redesigns.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today? Who hits this (admin, teacher, parent)?
      placeholder: School admins cannot…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Prefer one clear outcome over a laundry list.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you already tried.
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Landing / marketing
        - Onboarding (wizard / Toshi)
        - Admin dashboard
        - Teacher
        - Parent / WhatsApp
        - Docs / community
        - Other
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this (after syncing from main)
        - label: I only want to request it
