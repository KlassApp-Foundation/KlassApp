name: Test Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Environment variable names visible to PHP (no values)
        run: php -r '$e=array_keys(getenv()); sort($e); echo implode("\n",$e),PHP_EOL;'

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run full suite with known-failures guard
        run: bash scripts/test-guard.sh
