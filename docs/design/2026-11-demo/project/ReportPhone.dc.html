<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Report cards · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/2d64299756c498eaac73eca43e345662">
<link rel="stylesheet" href="/_blob/c24597bf56a23cc9cc50e35009507245">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{box-sizing:border-box}</style>
</helmet>
<div style="width: 375px; height: 1300px; background: #FAFAF5; font-family: 'DM Sans', system-ui, sans-serif; color: #1E293B;">
  <dc-import name="PhoneBar" title="Report cards" hint-size="375px,64px"></dc-import>
  <div style="padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; gap: 8px;">
      <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 0.75rem; color: #475569;">Class<select class="ds-input" style="min-height: 44px;"><option>Primary Seven</option></select></label>
      <label style="flex: 1.3; display: flex; flex-direction: column; gap: 4px; font-size: 0.75rem; color: #475569;">Exam<select class="ds-input" style="min-height: 44px;"><option>Mid Term · T3</option></select></label>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <div style="background: #F0F6FE; border: 1px solid #D6E6FA; border-radius: 14px; padding: 12px;"><div style="font: 700 1.2rem 'Sora', sans-serif;">68.4</div><div style="font-size: 0.75rem; color: #475569;">class average</div></div>
      <div style="background: #F0F6FE; border: 1px solid #D6E6FA; border-radius: 14px; padding: 12px;"><div style="font: 700 1.2rem 'Sora', sans-serif;">21</div><div style="font-size: 0.75rem; color: #475569;">in Division I</div></div>
    </div>
    <button type="button" class="ds-btn ds-btn-primary" style="min-height: 48px;">Download all 98 cards (one PDF)</button>
    <div style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; overflow: hidden;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #E2E8F0;">
          <span style="width: 34px; font: 700 0.9rem 'Sora', sans-serif; color: #475569;">{{r.pos}}</span>
          <div style="flex: 1; min-width: 0;"><div style="font-weight: 600;">{{r.name}}</div><div style="font-size: 0.75rem; color: #475569;">Primary Seven {{r.st}} · total {{r.t}} · agg {{r.agg}} · Div {{r.div}}</div></div>
          <button type="button" aria-label="{{r.dl}}" style="width: 44px; height: 44px; border: 1px solid #E2E8F0; border-radius: 10px; background: #FFFFFF; color: #1E293B; display: inline-flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg></button>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const d = [['Nia Brown', 'W', 372, 4, 'I'], ['Kwame Asante', 'E', 360, 5, 'I'], ['Lina Haddad', 'E', 351, 6, 'I'], ['Mateo Rossi', 'W', 335, 8, 'I'],
      ['Priya Nair', 'E', 324, 10, 'I'], ['Tendai Moyo', 'W', 285, 15, 'II'], ['Sofia Petrov', 'E', 248, 21, 'II'], ['Yusuf Bello', 'W', 203, 27, 'III']];
    return { rows: d.map((x, i) => ({ pos: i + 1, name: x[0], st: x[1], t: x[2], agg: x[3], div: x[4], dl: 'Download report card for ' + x[0] })) };
  }
}
</script>
</body>
</html>
