<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/2d64299756c498eaac73eca43e345662">
<link rel="stylesheet" href="/_blob/c24597bf56a23cc9cc50e35009507245">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 248px; box-sizing: border-box; padding: 18px 12px 16px; display: flex; flex-direction: column; gap: 16px; font-family: 'DM Sans', system-ui, sans-serif; color: #1E293B; background: #FAFAF5;">
  <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 2px;">
    <a href="{{homeHref}}" style="display: block; padding: 2px 8px 14px;" aria-label="KlassApp home">
      <img src="/_blob/c3d90217bfb0db725f925db7ee272e87" alt="KlassApp" style="height: 30px; width: auto; display: block;">
    </a>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <sc-if value="{{g.label}}" hint-placeholder-val="{{true}}">
        <div style="padding: 14px 12px 6px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #64748B;">{{g.label}}</div>
      </sc-if>
      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
        <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{it.icon}}"></path></svg>
          <span style="flex: 1;">{{it.label}}</span>
          <sc-if value="{{it.count}}" hint-placeholder-val="{{false}}">
            <span style="min-width: 22px; padding: 1px 7px; border-radius: 999px; background: #1E6FD9; color: #FFFFFF; font-size: 0.72rem; font-weight: 700; text-align: center;">{{it.count}}</span>
          </sc-if>
        </a>
      </sc-for>
    </sc-for>
  </nav>
  <div style="border-top: 1px solid #E2E8F0; padding-top: 12px; display: flex; flex-direction: column; gap: 6px;">
    <button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; font: 500 0.92rem 'DM Sans', sans-serif; color: #1E293B; cursor: pointer; text-align: left;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
      <span style="flex: 1;">Notifications</span>
      <span style="min-width: 22px; padding: 1px 7px; border-radius: 999px; background: #B91C1C; color: #FFFFFF; font-size: 0.72rem; font-weight: 700; text-align: center;">4</span>
    </button>
    <button type="button" aria-haspopup="menu" aria-expanded="{{menuOpen}}" style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 10px; border: 1px solid #E2E8F0; border-radius: 12px; background: #FFFFFF; font-family: inherit; color: inherit; cursor: pointer; text-align: left;">
      <span style="width: 36px; height: 36px; border-radius: 50%; background: {{avatarBg}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 0.8rem 'Sora', sans-serif; flex-shrink: 0;">{{initials}}</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25;">
        <span style="font-size: 0.86rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{name}}</span>
        <span style="font-size: 0.74rem; color: #64748B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{roleLabel}}</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 9l4-4 4 4m0 6l-4 4-4-4"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","students","teachers","parents","classes","subjects","attendance","examsets","marks","reports","fees","whatsapp"],"default":"examsets"},"role":{"editor":"enum","options":["admin","teacher","parent","student"],"default":"admin"},"menuOpen":{"editor":"boolean","default":false},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      dashboard: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6',
      students: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0z',
      teachers: 'M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z',
      parents: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z',
      classes: 'M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4',
      subjects: 'M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253',
      attendance: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4',
      examsets: 'M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z',
      marks: 'M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z',
      reports: 'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z',
      fees: 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z',
      whatsapp: 'M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z'
    };
    const active = this.props.active ?? 'examsets';
    const role = this.props.role ?? 'admin';
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-size: 0.92rem;';
    const on = base + ' background: #DCFCE7; color: #14532D; font-weight: 700;';
    const off = base + ' color: #1E293B; font-weight: 500;';
    const fam = role === 'parent' || role === 'student';
    const hrefs = role === 'teacher'
      ? { dashboard: 'TeacherDash.dc.html', marks: 'MarksToMark.dc.html', reports: 'ReportCards.dc.html', students: 'StudentProfile.dc.html', classes: 'Classes.dc.html' }
      : fam ? { dashboard: 'ParentDash.dc.html', marks: 'ParentMarks.dc.html', attendance: 'ParentAttendance.dc.html', fees: 'ParentFees.dc.html' }
      : { dashboard: 'AdminDash.dc.html', examsets: 'ExamSetList.dc.html', marks: 'Approvals.dc.html', reports: 'ReportCards.dc.html', students: 'StudentProfile.dc.html', classes: 'Classes.dc.html', fees: 'FeesStructure.dc.html' };
    const it = (key, label, count) => ({ label, count: count || false, icon: I[key], href: hrefs[key] || '#', current: key === active ? 'page' : 'false', style: key === active ? on : off });
    const groups = {
      admin: [
        { label: false, items: [it('dashboard', 'Dashboard')] },
        { label: 'People', items: [it('students', 'Students'), it('teachers', 'Teachers and staff'), it('parents', 'Parents')] },
        { label: 'Academics', items: [it('classes', 'Classes and streams'), it('subjects', 'Subjects'), it('attendance', 'Attendance'), it('examsets', 'Exam sets'), it('marks', 'Marks', '6'), it('reports', 'Report cards')] },
        { label: 'Money', items: [it('fees', 'Fees')] },
        { label: 'Messages', items: [it('whatsapp', 'WhatsApp')] }
      ],
      teacher: [
        { label: false, items: [it('dashboard', 'Dashboard')] },
        { label: 'My teaching', items: [it('classes', 'My classes'), it('students', 'Students'), it('attendance', 'Attendance'), it('marks', 'Marks', '3'), it('reports', 'Report cards')] }
      ],
      parent: [
        { label: false, items: [it('dashboard', 'Home'), it('marks', 'Marks'), it('attendance', 'Attendance'), it('fees', 'Fees')] }
      ],
      student: [
        { label: false, items: [it('dashboard', 'Home'), it('marks', 'Marks'), it('attendance', 'Attendance'), it('fees', 'Fees')] }
      ]
    };
    const who = {
      admin: ['Grace Achieng', 'GA', 'School admin', '#1E6FD9'],
      teacher: ['Daniel Okafor', 'DO', 'Teacher · Primary Five class head', '#15803D'],
      parent: ['Ruth Okoro', 'RO', 'Parent', '#B45309'],
      student: ['Amara Okoro', 'AO', 'Student · Primary Five E', '#1E6FD9']
    }[role] || ['Grace Achieng', 'GA', 'School admin', '#1E6FD9'];
    return { groups: groups[role] || groups.admin, homeHref: hrefs.dashboard, name: who[0], initials: who[1], roleLabel: who[2], avatarBg: who[3], menuOpen: (this.props.menuOpen === true || this.props.menuOpen === 'true') ? 'true' : 'false' };
  }
}
</script>
</body>
</html>
