<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account menu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/2d64299756c498eaac73eca43e345662">
<link rel="stylesheet" href="/_blob/c24597bf56a23cc9cc50e35009507245">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{box-sizing:border-box}</style>
</helmet>
<div style="width: 1032px; height: 460px; background: #FAFAF5; padding: 24px; font-family: 'DM Sans', system-ui, sans-serif; color: #1E293B; display: flex; gap: 32px; align-items: flex-end;">
  <sc-for list="{{menus}}" as="m" hint-placeholder-count="3">
    <div style="width: 260px; display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 0.72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #64748B;">{{m.title}}</div>
      <div role="menu" aria-label="Account" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,0.06);">
        <div style="padding: 10px 12px; border-bottom: 1px solid #E2E8F0; margin-bottom: 4px;"><div style="font-weight: 700; font-size: 0.88rem;">{{m.name}}</div><div style="font-size: 0.76rem; color: #64748B;">{{m.email}}</div></div>
        <sc-for list="{{m.items}}" as="i" hint-placeholder-count="3">
          <a href="#" role="menuitem" style="{{i.style}}">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"></path></svg>{{i.label}}
          </a>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 10px; border: 2px solid #1E293B; border-radius: 12px; background: #FFFFFF;">
        <span style="width: 36px; height: 36px; border-radius: 50%; background: {{m.bg}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 0.8rem 'Sora', sans-serif;">{{m.ini}}</span>
        <span style="flex: 1; line-height: 1.25;"><span style="display: block; font-size: 0.86rem; font-weight: 700;">{{m.name}}</span><span style="font-size: 0.74rem; color: #64748B;">{{m.role}}</span></span>
      </div>
      <div style="font-size: 0.76rem; color: #475569;">{{m.note}}</div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1032,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      profile: 'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z',
      password: 'M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z',
      settings: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065zM15 12a3 3 0 11-6 0 3 3 0 016 0z',
      help: 'M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z',
      logout: 'M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1'
    };
    const st = (danger) => 'display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border-radius: 9px; text-decoration: none; font-size: 0.88rem; font-weight: 500; color: ' + (danger ? '#B91C1C' : '#1E293B') + ';';
    const i = (k, label) => ({ label, icon: P[k], style: st(k === 'logout') });
    return { menus: [
      { title: 'School admin', name: 'Grace Achieng', email: 'grace@riverside.school', role: 'School admin', ini: 'GA', bg: '#1E6FD9', note: 'Admins also get Settings and Help.',
        items: [i('profile', 'Profile'), i('password', 'Change password'), i('settings', 'Settings'), i('help', 'Help'), i('logout', 'Log out')] },
      { title: 'Teacher', name: 'Daniel Okafor', email: 'daniel@riverside.school', role: 'Teacher', ini: 'DO', bg: '#15803D', note: 'Same three items for teachers, parents and students.',
        items: [i('profile', 'Profile'), i('password', 'Change password'), i('logout', 'Log out')] },
      { title: 'Parent', name: 'Ruth Okoro', email: 'ruth.okoro@mail.com', role: 'Parent', ini: 'RO', bg: '#B45309', note: 'On phones the menu opens from the avatar in the top bar as a bottom sheet.',
        items: [i('profile', 'Profile'), i('password', 'Change password'), i('logout', 'Log out')] }
    ] };
  }
}
</script>
</body>
</html>
