<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teacher dashboard · states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/2d64299756c498eaac73eca43e345662">
<link rel="stylesheet" href="/_blob/c24597bf56a23cc9cc50e35009507245">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}*{box-sizing:border-box}a{color:#1D4ED8}a:hover{color:#1E3A8A}
.ka-th{padding:10px 12px;font:600 0.72rem 'Sora',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#475569;text-align:left;white-space:nowrap}
.ka-td{padding:10px 12px;font-variant-numeric:tabular-nums}
.ka-h1{margin:0;font-family:'Sora',system-ui,sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:-0.02em}
.ka-h2{margin:0;font:600 1rem 'Sora',sans-serif}
.ka-card{border:1px solid #E2E8F0;border-radius:14px;padding:18px 20px;background:#FFFFFF}
.ka-lbl{font-size:0.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#64748B}
@keyframes ka-shimmer{0%{opacity:.55}50%{opacity:1}100%{opacity:.55}}
.ka-sk{background:#E2E8F0;border-radius:8px;animation:ka-shimmer 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.ka-sk{animation:none}}
</style>
</helmet>
<div style="min-height: 100vh; background: #FAFAF5; padding: 24px; font-family: 'DM Sans', system-ui, sans-serif; color: #1E293B; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 20px; align-content: start;">
  <section aria-label="Empty" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px;">
    <div class="ka-lbl">Empty · new teacher</div>
    <div style="border: 1px dashed #CBD5E1; border-radius: 14px; padding: 32px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <h2 class="ka-h2">No classes yet</h2><p style="margin: 0; font-size: 0.86rem; color: #475569; line-height: 1.5; max-width: 380px;">When the school assigns you a class or a subject, your students, attendance and exams appear here.</p>
    </div>
  </section>
  <section aria-label="Loading" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px;">
    <div class="ka-lbl">Loading</div>
    <div class="ka-sk" style="height: 24px; width: 60%;"></div>
    <div class="ka-sk" style="height: 56px; border-radius: 12px;"></div>
    <div class="ka-sk" style="height: 56px; border-radius: 12px;"></div>
    <div class="ka-sk" style="height: 56px; border-radius: 12px;"></div>
    <div style="font-size: 0.82rem; color: #475569;">Loading your classes…</div>
  </section>
  <section aria-label="Error" style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 20px; padding: 22px; display: flex; flex-direction: column; gap: 12px;">
    <div class="ka-lbl">Error</div>
    <div role="alert" style="background: #FEF2F2; border: 1px solid #FECACA; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <div style="font-weight: 700; color: #7F1D1D;">Attendance wasn't saved</div><p style="margin: 0; font-size: 0.86rem; color: #7F1D1D; line-height: 1.5;">Today's register for Primary Five is kept on this phone and saves when you're back online.</p><div style="display: flex; gap: 8px; flex-wrap: wrap;"><button type="button" class="ds-btn ds-btn-primary" style="min-height: 44px;">Try again now</button></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
