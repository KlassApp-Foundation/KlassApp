<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone top bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/2d64299756c498eaac73eca43e345662">
<link rel="stylesheet" href="/_blob/c24597bf56a23cc9cc50e35009507245">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header style="box-sizing: border-box; width: 100%; height: 64px; padding: 0 8px; background: #FFFFFF; border-bottom: 1px solid #E2E8F0; display: flex; align-items: center; gap: 4px; font-family: 'DM Sans', system-ui, sans-serif; color: #1E293B;">
  <button type="button" aria-label="{{leftLabel}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #1E293B; display: inline-flex; align-items: center; justify-content: center;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{leftIcon}}"></path></svg>
  </button>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2;">
    <span style="font: 700 1rem 'Sora', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{title}}</span>
    <span style="font-size: 0.72rem; color: #64748B;">Riverside · Term 3, 2026</span>
  </div>
  <button type="button" aria-label="Account menu" aria-haspopup="menu" style="width: 44px; height: 44px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center;">
    <span style="width: 32px; height: 32px; border-radius: 50%; background: {{avatarBg}}; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font: 700 0.75rem 'Sora', sans-serif;">{{initials}}</span>
  </button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Exam sets"},"back":{"editor":"boolean","default":false},"role":{"editor":"enum","options":["admin","teacher","parent","student"],"default":"admin"},"$preview":{"width":375,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const back = this.props.back === true || this.props.back === 'true';
    const t = (this.props.role ?? 'admin') === 'teacher';
    return {
      title: this.props.title ?? 'Exam sets',
      leftIcon: back ? 'M10 19l-7-7m0 0l7-7m-7 7h18' : 'M4 6h16M4 12h16M4 18h16',
      leftLabel: back ? 'Back' : 'Open menu',
      initials: { admin: 'GA', teacher: 'DO', parent: 'RO', student: 'AO' }[this.props.role ?? 'admin'] || 'GA',
      avatarBg: { admin: '#1E6FD9', teacher: '#15803D', parent: '#B45309', student: '#1E6FD9' }[this.props.role ?? 'admin'] || '#1E6FD9'
    };
  }
}
</script>
</body>
</html>
