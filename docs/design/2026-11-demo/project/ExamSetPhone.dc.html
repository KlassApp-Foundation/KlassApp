<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New exam set · phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/2d64299756c498eaac73eca43e345662">
<link rel="stylesheet" href="/_blob/c24597bf56a23cc9cc50e35009507245">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}*{box-sizing:border-box}
.ka-switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:#CBD5E1;position:relative;flex-shrink:0;margin:0}
.ka-switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s ease}
.ka-switch:checked{background:#15803D}.ka-switch:checked::after{left:21px}
</style>
</helmet>
<div style="width: 375px; height: 1560px; background: #FAFAF5; font-family: 'DM Sans', system-ui, sans-serif; color: #1E293B; display: flex; flex-direction: column; position: relative;">
  <dc-import name="PhoneBar" title="New exam set" back="true" hint-size="375px,64px"></dc-import>
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 120px;">
    <section style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px;">
      <label for="pt" style="font: 600 0.95rem 'Sora', sans-serif;">1. Term</label>
      <select id="pt" class="ds-input" style="min-height: 48px; width: 100%;"><option>Term 3, 2026 (current)</option></select>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 4px;">
      <h2 style="margin: 0 0 6px; font: 600 0.95rem 'Sora', sans-serif;">2. Exam types</h2>
      <sc-for list="{{types}}" as="t" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; border-top: 1px solid #E2E8F0;">
          <div style="flex: 1; min-width: 0;">
            <div style="font-weight: 600; font-size: 0.9rem;">{{t.name}}</div>
            <div style="font-size: 0.75rem; color: #64748B;">{{t.sub}}</div>
          </div>
          <input type="checkbox" class="ka-switch" checked="{{t.on}}" aria-label="{{t.name}}">
        </div>
      </sc-for>
      <button type="button" class="ds-btn ds-btn-outline" style="min-height: 44px; margin-top: 8px;">Add exam type</button>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
      <h2 style="margin: 0; font: 600 0.95rem 'Sora', sans-serif;">3. Classes</h2>
      <button type="button" aria-pressed="true" style="min-height: 48px; border-radius: 999px; border: 1px solid #15803D; background: #15803D; color: #FFFFFF; font: 600 0.9rem 'DM Sans', sans-serif; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M5 13l4 4L19 7"></path></svg>Whole school · 10 classes
      </button>
      <sc-for list="{{levels}}" as="lv" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #64748B;">{{lv.name}}</div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px;">
            <sc-for list="{{lv.classes}}" as="c" hint-placeholder-count="3">
              <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #86EFAC; background: #F0FDF4; color: #14532D; font: 600 0.85rem 'DM Sans', sans-serif; display: inline-flex; align-items: center; gap: 6px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 13l4 4L19 7"></path></svg>{{c}}
              </button>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <div style="border: 1px solid #E2E8F0; border-radius: 12px; padding: 12px; background: #FAFAF5; font-size: 0.82rem; color: #334155;">Classes are the default. Tap a selected class again to choose a single stream; a sheet opens with <strong>Whole class</strong>, <strong>Primary Five E</strong> and <strong>Primary Five W</strong>.</div>
    </section>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E2E8F0; display: flex; align-items: center; gap: 12px;">
    <div style="flex: 1; line-height: 1.2;"><div style="font: 700 1.1rem 'Sora', sans-serif;">129 exams</div><div style="font-size: 0.75rem; color: #64748B;">3 types · 10 classes</div></div>
    <button type="button" class="ds-btn ds-btn-primary" style="min-height: 48px; padding: 0 20px;">Create 129 exams</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      types: [
        { name: 'Beginning of Term', sub: 'Counts towards report', on: true },
        { name: 'Mid Term', sub: 'Counts towards report', on: true },
        { name: 'End of Term', sub: 'Counts towards report', on: true },
        { name: 'Weekly Test', sub: "School's own · doesn't count", on: false }
      ],
      levels: [
        { name: 'Nursery', classes: ['Baby Class', 'Middle Class', 'Top Class'] },
        { name: 'Lower primary', classes: ['Primary One', 'Primary Two', 'Primary Three'] },
        { name: 'Upper primary', classes: ['Primary Four', 'Primary Five', 'Primary Six', 'Primary Seven'] }
      ]
    };
  }
}
</script>
</body>
</html>
