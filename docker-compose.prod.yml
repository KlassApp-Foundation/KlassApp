# =====================================================================
# KlassApp — legacy Portainer / droplet compose (DigitalOcean stack retired).
# Production is Laravel Cloud; this file is kept for local/historical reference.
# WhatsApp is Meta Cloud API — Evolution API + n8n stubs were removed.
# Required env vars: APP_KEY, WHATSAPP_HMAC_SECRET (and DB/Redis/Google OAuth as used)
# =====================================================================

services:
  # ==================== KLASSAPP: DATABASE ====================
  database:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3307:3306" # Exposed on 3307 to avoid conflicts — change to 3306 if you want standard port
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-klassapp}
      MYSQL_USER: ${DB_USERNAME:-klassapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - klassapp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==================== CACHE ====================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - klassapp
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  # ==================== KLASSAPP: APP ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Commented user for production
    # user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    container_name: sms-app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://klassapp.xyz}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-klassapp}
      DB_USERNAME: ${DB_USERNAME:-klassapp}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      WHATSAPP_HMAC_SECRET: ${WHATSAPP_HMAC_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      PHP_FPM_LISTEN: "0.0.0.0:9000"
    volumes:
      - .:/var/www
    depends_on:
      database:
        condition: service_healthy
    networks:
      - klassapp

  # ==================== KLASSAPP: WEB SERVER ====================
  nginx:
    image: nginx:alpine
    container_name: sms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./public:/var/www/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt
    networks:
      - klassapp
    depends_on:
      - app

# ==================== VOLUMES ====================
volumes:
  db_data:

# ==================== NETWORK ====================
networks:
  klassapp:
    driver: bridge
