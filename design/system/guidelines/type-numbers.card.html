<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--d-white);font-family:var(--d-font-body)}.wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px}.kpi{font-family:var(--d-font-display);font-size:1.6rem;font-weight:700;color:var(--d-dark);line-height:1.2}.lab{font-size:.78rem;color:var(--d-muted);margin-top:4px}.num{font-variant-numeric:tabular-nums;text-align:right;font-size:.85rem;color:var(--d-text);padding:3px 0}.m{font-size:11px;color:var(--d-muted);margin-top:8px}</style></head><body>
<div class="wrap">
<div><div class="kpi">UGX 18.4M</div><div class="lab">Fees Collected</div><div class="m">KPI value · Sora 700 / 1.6rem. Currency code first, abbreviated.</div></div>
<div><div class="num">UGX 450,000</div><div class="num">UGX 300,000</div><div class="num">UGX 0</div><div class="m">.dt-cell-num · tabular-nums, right aligned, full figures with separators.</div></div>
</div></body></html>
