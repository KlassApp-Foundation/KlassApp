<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--d-white);font-family:var(--d-font-body)}.row{display:flex;align-items:flex-end;gap:14px}.i{text-align:center}.bar{background:var(--d-green);opacity:.85;border-radius:3px;height:44px}.n{font-size:10px;color:var(--d-muted);margin-top:6px;font-variant-numeric:tabular-nums}.note{font-size:12px;color:var(--d-text-secondary);margin-top:14px}</style></head><body>
<div class="row">
<div class="i"><div class="bar" style="width:4px"></div><div class="n">4</div></div>
<div class="i"><div class="bar" style="width:6px"></div><div class="n">6</div></div>
<div class="i"><div class="bar" style="width:8px"></div><div class="n">8</div></div>

<div class="i"><div class="bar" style="width:12px"></div><div class="n">12</div></div>

<div class="i"><div class="bar" style="width:20px"></div><div class="n">20</div></div>

</div>

</body></html>
