<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--d-white);font-family:var(--d-font-body)}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sw{border-radius:12px;height:66px}.n{font-size:12px;font-weight:600;color:var(--d-text);margin-top:8px}.h{font-size:11px;color:var(--d-muted)}</style></head><body>
<div class="row">
<div><div class="sw" style="background:var(--d-accent-lt)"></div><div class="n">--d-accent-lt</div><div class="h">#4ADE80 · sheen, live badge tail</div></div>
<div><div class="sw" style="background:var(--d-accent)"></div><div class="n">--d-accent = --d-green</div><div class="h">#22C55E · rest state</div></div>
<div><div class="sw" style="background:var(--d-accent-dk)"></div><div class="n">--d-accent-dk</div><div class="h">#16A34A · hover / press</div></div>
</div></body></html>
