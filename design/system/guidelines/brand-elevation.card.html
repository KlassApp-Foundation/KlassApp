<!-- @dsCard group="Brand" viewport="700x180" name="Elevation" subtitle="A hairline ring is the default; shadow is earned, never decorative" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--d-canvas);font-family:var(--d-font-body)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.n{font-size:11px;font-weight:600;color:var(--d-text)}.h{font-size:10px;color:var(--d-muted);margin-top:3px;line-height:1.4}</style></head><body>
<div class="row">
<div class="ds-card ds-card-shadow-sm"><div class="n">shadow sm</div><div class="h">0 0 0 1px border — the default on every card</div></div>
<div class="ds-card ds-card-shadow-md"><div class="n">shadow md</div><div class="h">ring + 0 2px 8px rgba(0,0,0,.04)</div></div>
<div class="ds-card ds-card-shadow-lg"><div class="n">shadow lg</div><div class="h">ring + 0 8px 24px rgba(0,0,0,.06)</div></div>
<div class="ds-card" style="box-shadow:0 8px 40px rgba(0,0,0,.12)"><div class="n">float</div><div class="h">0 8px 40px rgba(0,0,0,.12) — Toshi panel only</div></div>
</div></body></html>
