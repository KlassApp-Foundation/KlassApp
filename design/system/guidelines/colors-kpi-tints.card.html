<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--d-white);font-family:var(--d-font-body)}.row{display:flex;gap:18px}.chip{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}.n{font-size:11px;color:var(--d-muted);margin-top:8px}.d{width:18px;height:18px;border-radius:50%;border:2px solid currentColor}</style></head><body>
<div class="row">
<div><div class="chip" style="background:rgba(30,111,217,0.10);color:var(--d-blue)"><span class="d"></span></div><div class="n">blue</div></div>
<div><div class="chip" style="background:rgba(22,163,74,0.10);color:#16A34A"><span class="d"></span></div><div class="n">green</div></div>
<div><div class="chip" style="background:rgba(217,119,6,0.10);color:var(--d-amber)"><span class="d"></span></div><div class="n">amber</div></div>
<div><div class="chip" style="background:rgba(220,38,38,0.10);color:var(--d-red)"><span class="d"></span></div><div class="n">red</div></div>
<div><div class="chip" style="background:rgba(139,92,246,0.10);color:#8B5CF6"><span class="d"></span></div><div class="n">purple</div></div>
<div style="font-size:12px;color:var(--d-text-secondary);align-self:center;max-width:300px">Purple appears <b>only</b> as a KPI tint. It is not a brand colour and never fills a button, badge or link.</div>
</div></body></html>
