<!-- @dsCard group="Colors" viewport="700x160" name="Status palette" subtitle="Badge fills — pale tint behind a saturated ink" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--d-white);font-family:var(--d-font-body)}.row{display:flex;flex-wrap:wrap;gap:10px}.i{text-align:center}.c{font-size:10px;color:var(--d-muted);margin-top:6px}</style></head><body>
<div class="row">
<div class="i"><span class="ds-badge ds-badge-paid ds-badge-md">Paid</span><div class="c">#e8f5e9 / #2e7d32</div></div>
<div class="i"><span class="ds-badge ds-badge-approved ds-badge-md">Approved</span><div class="c">same green</div></div>
<div class="i"><span class="ds-badge ds-badge-unpaid ds-badge-md">Unpaid</span><div class="c">#fbe9e7 / #DC2626</div></div>
<div class="i"><span class="ds-badge ds-badge-rejected ds-badge-md">Rejected</span><div class="c">same red</div></div>
<div class="i"><span class="ds-badge ds-badge-warning ds-badge-md">Overdue</span><div class="c">#fff8e1 / #D97706</div></div>
<div class="i"><span class="ds-badge ds-badge-pending ds-badge-md">Pending</span><div class="c">#f0eee6 / #64748B</div></div>
<div class="i"><span class="ds-badge ds-badge-inactive ds-badge-md">Inactive</span><div class="c">#f0eee6 / #94A3B8</div></div>
</div>
<div class="row" style="margin-top:16px">
<span style="font-size:12px;color:var(--d-text)"><span class="ds-dot ds-dot-green"></span>Present</span>
<span style="font-size:12px;color:var(--d-text)"><span class="ds-dot ds-dot-blue"></span>Synced</span>
<span style="font-size:12px;color:var(--d-text)"><span class="ds-dot ds-dot-amber"></span>Part paid</span>
<span style="font-size:12px;color:var(--d-text)"><span class="ds-dot ds-dot-red"></span>Absent</span>
<span style="font-size:12px;color:var(--d-text)"><span class="ds-dot ds-dot-gray"></span>Not started</span>
</div></body></html>
