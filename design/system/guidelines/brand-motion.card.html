<!-- @dsCard group="Brand" viewport="700x200" name="Motion & states" subtitle="Hover lifts 1px, press shrinks to .97, entrances fade up 8–12px" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--d-canvas);font-family:var(--d-font-body)}.row{display:flex;gap:14px;align-items:stretch}.col{flex:1}.n{font-size:11px;font-weight:600;color:var(--d-text);margin-bottom:6px}.h{font-size:11px;color:var(--d-text-secondary);line-height:1.5}.demo{background:var(--d-white);border:1px solid var(--d-border);border-radius:14px;padding:14px;height:100%;box-sizing:border-box}</style></head><body>
<div class="row">
<div class="col"><div class="demo"><div class="n">Hover</div><div class="h">translateY(-1px) + stronger ring, 0.2s ease. Cards and links only.</div><div style="margin-top:10px"><button class="ds-btn ds-btn-primary ds-btn-sm">Hover me</button></div></div></div>
<div class="col"><div class="demo"><div class="n">Press</div><div class="h">scale(0.97) on every .ds-btn, 0.15s ease. No colour change beyond the darker hover fill.</div><div style="margin-top:10px"><button class="ds-btn ds-btn-outline ds-btn-sm">Press me</button></div></div></div>
<div class="col"><div class="demo"><div class="n">Entrance</div><div class="h">Shell fades + slides 8px in 0.25s; KPI tiles fade up 12px, staggered 60ms. Nothing bounces, nothing springs.</div><div style="margin-top:10px" class="ds-save-indicator ds-save-indicator--saving"><span class="ds-save-indicator__dot"></span>Saving…</div></div></div>
</div></body></html>
