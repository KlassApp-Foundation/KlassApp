<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Warm parchment canvas, white cards — never grey on grey" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--d-white);font-family:var(--d-font-body)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.sw{border-radius:12px;height:66px;border:1px solid var(--d-border)}.n{font-size:12px;font-weight:600;color:var(--d-text);margin-top:8px}.h{font-size:11px;color:var(--d-muted)}</style></head><body>
<div class="row">
<div><div class="sw" style="background:var(--d-canvas)"></div><div class="n">--d-canvas / --d-surface / --d-shell</div><div class="h">#FAFAF5 · page + shell</div></div>
<div><div class="sw" style="background:var(--d-white)"></div><div class="n">--d-white</div><div class="h">#FFFFFF · cards, tables</div></div>
<div><div class="sw" style="background:var(--d-dark)"></div><div class="n">--d-dark</div><div class="h">#0F172A · sidebar, headings</div></div>
<div><div class="sw" style="background:var(--d-dark-surface)"></div><div class="n">--d-dark-surface</div><div class="h">#1E293B · raised dark rows</div></div>
</div></body></html>
