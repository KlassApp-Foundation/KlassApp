<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--d-white);font-family:var(--d-font-body)}.wrap{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}.l{font-size:15px;margin-bottom:8px}.t{font-size:11px;color:var(--d-muted);margin-left:8px}.b{height:0;border-top:1px solid var(--d-border);margin:10px 0 4px}.b2{height:0;border-top:1px solid var(--d-border-strong);margin:10px 0 4px}.c{font-size:11px;color:var(--d-muted)}</style></head><body>
<div class="wrap"><div>
<div class="l" style="color:var(--d-text)">Fee payments recorded today<span class="t">--d-text #1E293B</span></div>
<div class="l" style="color:var(--d-text-secondary)">Term 2 2026 · Senior 2<span class="t">--d-text-secondary #64748B</span></div>
<div class="l" style="color:var(--d-muted)">Awaiting sync<span class="t">--d-muted #94A3B8</span></div>
</div><div>
<div class="b"></div><div class="c">--d-border #E2E8F0 · every card, row and input</div>
<div class="b2"></div><div class="c">--d-border-strong #CBD5E1 · hover, outline button</div>
<div class="c" style="margin-top:12px">--d-ring · 0 0 0 1px --d-border</div>
</div></div></body></html>
