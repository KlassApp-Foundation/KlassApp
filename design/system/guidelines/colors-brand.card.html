<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--d-white);font-family:var(--d-font-body)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.sw{border-radius:12px;height:66px;display:flex;align-items:flex-end;padding:8px 10px;color:#fff;font-size:11px;font-weight:600}.n{font-size:12px;font-weight:600;color:var(--d-text);margin-top:8px}.h{font-size:11px;color:var(--d-muted);font-variant-numeric:tabular-nums}</style></head><body>
<div class="row">
<div><div class="sw" style="background:var(--d-blue)">informational</div><div class="n">--d-blue</div><div class="h">#1E6FD9</div></div>
<div><div class="sw" style="background:var(--d-green)">primary action</div><div class="n">--d-green</div><div class="h">#22C55E</div></div>
<div><div class="sw" style="background:var(--d-amber)">warning</div><div class="n">--d-amber</div><div class="h">#D97706</div></div>
<div><div class="sw" style="background:var(--d-red)">destructive</div><div class="n">--d-red</div><div class="h">#DC2626</div></div>
</div></body></html>
