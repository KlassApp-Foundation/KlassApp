<!doctype html>
<html lang="en">
<head>

</head>
<body>
<div class="ap-page" data-screen-label="Error 403 on the vintage shell">
<div class="ap-bg-vintage" aria-hidden="true"></div>
<div class="ap-shell">
<aside class="ap-brand-panel ap-brand-panel--sm">
<div class="ap-brand-row">
<img src="../../../assets/brand/klassapp-icon.svg" class="ap-brand-logo" alt="KlassApp">
<div class="ap-brand-copy">
<p class="ap-brand-tagline">Something went off the page</p>

</div>
</div>
</aside>

<div class="ap-card">
<div class="err-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>
<p class="ap-eyebrow">Error 403</p>
<h1 class="ap-title">You don't have access to this page</h1>
<p class="ap-sub">Your account doesn't include this section. If you need it for your work, ask your school administrator to change your role.</p>
<div class="ap-actions ap-actions--row">
<a class="ap-submit" href="#">Go to home</a>
<button type="button" class="ap-secondary">Go back</button>
</div>
</div>
</main>
</div>
</div>
