<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Toshi orbit — fixed</title>

<style>
:root{--brand-blue:#1E6FD9;--brand-green:#22C55E;--brand-dark:#0F172A;--brand-white:#FFFFFF;--border:#E2E8F0;--radius-xl:20px;--radius-lg:16px}
*{box-sizing:border-box}body{margin:0;padding:24px;background:#FAFAF5;font-family:system-ui,sans-serif}
a{color:var(--brand-blue)}a:hover{color:var(--brand-dark)}
.toshi-tower{margin:0;background:var(--brand-white);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:0 0 0 1px var(--border);overflow:hidden}
.toshi-tower-stage{position:relative;width:100%;max-width:1100px;margin:0 auto}
.toshi-tower-stage svg{position:relative;z-index:1;display:block;width:100%;height:auto}
.toshi-depth{position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 40% 55% at 50% 46%,rgba(34,197,94,.10),transparent 70%)}
.tt-g{fill:var(--brand-green)}.tt-gs{stroke:var(--brand-green)}.tt-bs{stroke:var(--brand-blue)}.tt-d{fill:var(--brand-dark)}
.tt-stop-g{stop-color:var(--brand-green)}.tt-stop-b{stop-color:var(--brand-blue)}.tt-stop-d{stop-color:var(--brand-dark)}
.tt-tile rect{fill:var(--brand-white);stroke:var(--border)}
.tt-tile{transform-box:fill-box;transform-origin:50% 50%;filter:url(#tt-shadow)}
.tt-beat{fill:none;stroke:var(--brand-green);stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.tt-spin{opacity:.75;transform-box:view-box;transform-origin:500px 330px}
.tt-orbit{transform-box:view-box;transform-origin:500px 330px;opacity:.9}
.tt-mer{transform-box:fill-box;transform-origin:50% 50%;transform:scaleX(var(--ms))}
.tt-k{transform-box:fill-box;transform-origin:50% 50%}.tt-k+.tt-k{opacity:0}
@media (prefers-reduced-motion:no-preference){
 .tt-spin{animation:tt-spin 16s linear infinite}.tt-spin-b{animation-duration:11s;animation-direction:reverse}
 .tt-orbit{animation:tt-spin 26s linear infinite}
 @keyframes tt-spin{to{transform:rotate(360deg)}}
 .tt-k,.tt-k+.tt-k{animation:tt-k 32s linear infinite;animation-delay:var(--kd)}
 @keyframes tt-k{0.000%{transform:translateX(0.00px) scaleX(1.000);opacity:1}4.167%{transform:translateX(12.16px) scaleX(0.966);opacity:1}8.333%{transform:translateX(23.50px) scaleX(0.866);opacity:1}12.500%{transform:translateX(33.23px) scaleX(0.707);opacity:1}16.667%{transform:translateX(40.70px) scaleX(0.500);opacity:1}20.833%{transform:translateX(45.40px) scaleX(0.259);opacity:1}25.000%{transform:translateX(47.00px) scaleX(0.020);opacity:0}29.167%{transform:translateX(45.40px) scaleX(0.020);opacity:0}33.333%{transform:translateX(40.70px) scaleX(0.020);opacity:0}37.500%{transform:translateX(33.23px) scaleX(0.020);opacity:0}41.667%{transform:translateX(23.50px) scaleX(0.020);opacity:0}45.833%{transform:translateX(12.16px) scaleX(0.020);opacity:0}50.000%{transform:translateX(0.00px) scaleX(0.020);opacity:0}54.167%{transform:translateX(-12.16px) scaleX(0.020);opacity:0}58.333%{transform:translateX(-23.50px) scaleX(0.020);opacity:0}62.500%{transform:translateX(-33.23px) scaleX(0.020);opacity:0}66.667%{transform:translateX(-40.70px) scaleX(0.020);opacity:0}70.833%{transform:translateX(-45.40px) scaleX(0.020);opacity:0}75.000%{transform:translateX(-47.00px) scaleX(0.020);opacity:0}79.167%{transform:translateX(-45.40px) scaleX(0.259);opacity:1}83.333%{transform:translateX(-40.70px) scaleX(0.500);opacity:1}87.500%{transform:translateX(-33.23px) scaleX(0.707);opacity:1}91.667%{transform:translateX(-23.50px) scaleX(0.866);opacity:1}95.833%{transform:translateX(-12.16px) scaleX(0.966);opacity:1}100.000%{transform:translateX(-0.00px) scaleX(1.000);opacity:1}}
 .tt-mer{animation:tt-mer 32s ease-in-out infinite;animation-delay:calc(var(--m) * -4s)}
 @keyframes tt-mer{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
 .tt-core-pulse{animation:tt-core-pulse 4.5s ease-in-out infinite}
 @keyframes tt-core-pulse{0%,100%{opacity:.26}50%{opacity:.55}}
 .tt-beat{animation:tt-beat 18s ease-out infinite;animation-delay:var(--d,0s)}
 @keyframes tt-beat{0%{opacity:0;transform:scale(.35)}4%{opacity:.55;transform:scale(1)}8%{opacity:0;transform:scale(1.4)}100%{opacity:0;transform:scale(1.4)}}
}
@media (max-width:700px){
 .tt-x{display:none}
 .tt-core{transform-box:fill-box;transform-origin:50% 50%;transform:scale(1.3)}
 .tt-tile{transform:scale(1.45)}
 .tt-beat{animation-delay:var(--dm,0s)}
}
