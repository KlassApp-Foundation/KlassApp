le {\n    flex: 1;\n    font-family: 'DM Sans', sans-serif;\n    font-size: 14px;\n    font-weight: 700;\n    color: #0369A1;\n}\n[data-toshi-root] .toshi-plan-card-count {\n    font-family: 'DM Sans', sans-serif;\n    font-size: 11px;\n    font-weight: 600;\n    color: #0284C7;\n    background: #BAE6FD;\n    padding: 2px 8px;\n    border-radius: 10px;\n}\n[data-toshi-root] .toshi-plan-card-steps {\n    padding: 4px 14px 8px 14px;\n    display: flex;\n    flex-direction: column;\n    gap: 4px;\n}\n[data-toshi-root] .toshi-plan-step {\n    display: flex;\n    align-items: center;\n    gap: 6px;\n    padding: 6px 10px;\n    border-radius: 8px;\n    font-family: 'DM Sans', sans-serif;\n    font-size: 13px;\n    transition: background 0.15s ease;\n}\n[data-toshi-root] .toshi-plan-step.step-pending {\n    color: #0F172A;\n    background: transparent;\n}\n[data-toshi-root] .toshi-plan-step.step-active {\n    color: #0369A1;\n    background: #BAE6FD;\n    font-weight: 600;\n}\n[data-toshi-root] .toshi-plan-step.step-completed {\n    color: #166534;\n    background: #DCFCE7;\n}\n[data-toshi-root] .toshi-plan-step.step-failed {\n    color: #991B1B;\n    background: #FEE2E2;\n}\n[data-toshi-root] .toshi-plan-step-icon {\n    font-size: 14px;\n    width: 20px;\n    text-align: center;\n    flex-shrink: 0;\n}\n[data-toshi-root] .toshi-plan-step-num {\n    font-weight: 600;\n    min-width: 20px;\n    flex-shrink: 0;\n    color: var(--d-text-secondary);\n}\n[data-toshi-root] .toshi-plan-step.step-active .toshi-plan-step-num {\n    color: #0369A1;\n}\n[data-toshi-root] .toshi-plan-step-label {\n    flex: 1;\n}\n[data-toshi-root] .toshi-plan-card-footer {\n    display: flex;\n    gap: 8px;\n    padding: 4px 14px 12px 14px;\n}\n[data-toshi-root] .toshi-plan-btn {\n    flex: 1;\n    padding: 8px 16px;\n    border-radius: 8px;\n    font-family: 'DM Sans', sans-serif;\n    font-size: 13px;\n    font-weight: 600;\n    border: none;\n    cursor: pointer;\n    transition: all 0.15s ease;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 6px;\n}\n[data-toshi-root] .toshi-plan-btn-execute {\n    background: #0284C7;\n    color: #fff;\n}\n[data-toshi-root] .toshi-plan-btn-execute:hover {\n    background: #0369A1;\n}\n[data-toshi-root] .toshi-plan-btn-cancel {\n    background: #F1F5F9;\n    color: #475569;\n}\n[data-toshi-root] .toshi-plan-btn-cancel:hover {\n    background: #E2E8F0;\n}\n[data-toshi-root] .toshi-plan-card-done {\n    flex: 1;\n    text-align: center;\n    font-family: 'DM Sans', sans-serif;\n    font-size: 13px;\n    font-weight: 500;\n    color: #166534;\n    padding: 8px;\n}\n[data-toshi-root] .toshi-plan-card-processing {\n    flex: 1;\n    font-family: 'DM Sans', sans-serif;\n    font-size: 13px;\n    font-weight: 600;\n    color: #0369A1;\n    display: flex;\n    align-items: center;\n    gap: 6px;\n}\n[data-toshi-root] .toshi-plan-card-processing::before {\n    content: '';\n    display: inline-block;\n    width: 14px;\n    height: 14px;\n    border: 2px solid #BAE6FD;\n    border-top-color: #0369A1;\n    border-radius: 50%;\n    animation: toshi-spin 0.6s linear infinite;\n}\n@keyframes toshi-spin {\n    to { transform: rotate(360deg); }\n}\n\n\n/* Pre-onboarding product demo (top half of empty state) */\n.dashboard-kpi-placeholder {\n    min-height: 0;\n    border: none;\n    background: transparent;\n    padding: 0;\n    margin: 0 0 8px;\n}\n\n.setup-banner {\n    display: flex;\n    gap: 16px;\n    align-items: flex-start;\n    background: var(--d-white);\n    border: 1px solid var(--d-border);\n    border-radius: 14px;\n    padding: 20px 22px;\n    margin-bottom: 20px;\n    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);\n}\n.setup-banner-icon {\n    width: 40px;\n    height: 40px;\n    border-radius: 10px;\n    background: #F0FDF4;\n    color: var(--d-green);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    flex-shrink: 0;\n}\n.setup-banner-body { flex: 1; min-width: 0; }\n.setup-banner-title {\n    font-family: Sora, sans-serif;\n    font-size: 16px;\n    font-weight: 600;\n    color: #0F172A;\n    margin: 0;\n}\n.setup-banner-text {\n    font-family: \"DM Sans\", sans-serif;\n    font-size: 14px;\n    line-height: 1.5;\n    color: var(--d-text-secondary);\n    margin: 6px 0 0;\n}\n.setup-banner-actions {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 10px;\n    margin-top: 14px;\n}\n\n/* ── Wave 3: manual wizard shell ── */\n.manual-wizard {\n    max-width: 880px;\n    margin: 0 auto 48px;\n}\n.manual-wizard-card {\n    margin-top: 8px;\n}\n.manual-wizard-nav {\n    display: grid;\n    grid-template-columns: 1fr auto 1fr;\n    align-items: center;\n    gap: 16px;\n    margin-top: 24px;\n    padding: 0 4px;\n}\n.manual-wizard-nav > :first-child { justify-self: start; }\n.manual-wizard-nav > :last-child { justify-self: end; }\n.manual-wizard-progress {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 8px;\n    flex-wrap: wrap;\n    max-width: 320px;\n}\n.manual-wizard-dot {\n    width: 10px;\n    height: 10px;\n    border-radius: 999px;\n    border: none;\n    padding: 0;\n    background: #CBD5E1;\n    cursor: pointer;\n    transition: width 0.2s ease, background 0.2s ease, transform 0.15s ease;\n}\n.manual-wizard-dot.is-complete {\n    background: var(--d-green);\n}\n.manual-wizard-dot.is-current {\n    width: 28px;\n    background: var(--d-blue);\n    transform: none;\n}\n.manual-wizard-done-icon {\n    width: 56px;\n    height: 56px;\n    margin: 0 auto 16px;\n    border-radius: 999px;\n    background: #F0FDF4;\n    color: var(--d-green);\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 24px;\n    font-weight: 700;\n}\n.manual-wizard-suggestion {\n    display: block;\n    padding: 14px 16px;\n    border: 1px solid var(--d-border);\n    border-radius: 12px;\n    text-decoration: none;\n    background: var(--d-white);\n    transition: border-color 0.15s ease, box-shadow 0.15s ease;\n}\n.manual-wizard-suggestion:hover {\n    border-color: #BBF7D0;\n    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.08);\n}\n.manual-wizard-suggestion-title {\n    display: block;\n    font-family: Sora, sans-serif;\n    font-size: 14px;\n    font-weight: 600;\n    color: #0F172A;\n}\n.manual-wizard-suggestion-body {\n    display: block;\n    margin-top: 4px;\n    font-size: 13px;\n    color: var(--d-text-secondary);\n}\n\n/* Wave 3: maximized Toshi modal — slightly richer focus surface */\n[data-toshi-root] .toshi-modal-overlay {\n    backdrop-filter: blur(2px);\n}\n[data-toshi-root] .toshi-modal-box {\n    width: min(96vw, 1280px);\n    height: min(92vh, 920px);\n    max-width: 1280px;\n    max-height: 920px;\n}\n\n@media (max-width: 640px) {\n    .manual-wizard-nav {\n        grid-template-columns: 1fr 1fr;\n        grid-template-areas:\n            \"progress progress\"\n            \"prev next\";\n        row-gap: 12px;\n    }\n    .manual-wizard-progress { grid-area: progress; max-width: none; }\n    .manual-wizard-nav > :first-child { grid-area: prev; }\n    .manual-wizard-nav > :last-child { grid-area: next; }\n    .setup-banner { flex-direction: column; }\n}\n\n/* Manual wizard: hide Toshi panel + floating pill so progress metaphors don't compete. */\nbody.toshi-manual-wizard [data-toshi-root] {\n    display: none !important;\n}\n\n.manual-wizard-plan-grid {\n    display: grid;\n    grid-template-columns: 1fr;\n    gap: 12px;\n}\n\n@media (min-width: 640px) {\n    .manual-wizard-plan-grid {\n        grid-template-columns: repeat(3, 1fr);\n    }\n}\n\n.manual-wizard-plan-card {\n    display: flex;\n    flex-direction: column;\n    gap: 6px;\n    text-align: left;\n    padding: 14px 16px;\n    border: 1.5px solid #e2e8f0;\n    border-radius: 12px;\n    background: #ffffff;\n    cursor: pointer;\n    transition: border-color 0.15s, box-shadow 0.15s;\n    color: #0f172a;\n}\n\n.manual-wizard-plan-card:hover {\n    border-color: #22c55e;\n}\n\n.manual-wizard-plan-card.is-selected {\n    border-color: #22c55e;\n    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);\n    background: #f0fdf4;\n}\n\n.manual-wizard-plan-name {\n    font-family: Sora, sans-serif;\n    font-weight: 600;\n    font-size: 15px;\n}\n\n.manual-wizard-plan-price {\n    font-size: 13px;\n    color: #64748b;\n}\n\n.manual-wizard-plan-hint {\n    font-size: 11px;\n    font-weight: 600;\n    color: #15803d;\n    text-transform: uppercase;\n    letter-spacing: 0.04em;\n}\n\n/* Wave 3 review / preview — Toshi review-card structure, DS colors */\n.manual-wizard-review-intro {\n    font-size: 14px;\n    color: #64748B;\n    margin: 0 0 14px;\n    line-height: 1.45;\n}\n.manual-wizard-review-card {\n    background: #FFFFFF;\n    border: 1px solid #E2E8F0;\n    border-radius: 16px;\n    overflow: hidden;\n    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);\n}\n.manual-wizard-review-header {\n    background: #0F172A;\n    color: #FFFFFF;\n    padding: 14px 16px;\n    font-family: \"Sora\", sans-serif;\n    font-size: 14px;\n    font-weight: 700;\n    letter-spacing: -0.01em;\n}\n.manual-wizard-review-body {\n    padding: 8px 0;\n    display: flex;\n    flex-direction: column;\n}\n.manual-wizard-review-row {\n    display: flex;\n    align-items: flex-start;\n    justify-content: space-between;\n    gap: 12px;\n    padding: 12px 16px;\n    border-bottom: 1px solid #E2E8F0;\n}\n.manual-wizard-review-row:last-child {\n    border-bottom: none;\n}\n.manual-wizard-review-row-main {\n    display: flex;\n    align-items: flex-start;\n    gap: 10px;\n    min-width: 0;\n}\n.manual-wizard-review-icon {\n    font-size: 16px;\n    line-height: 1.4;\n    flex-shrink: 0;\n}\n.manual-wizard-review-label {\n    font-size: 11px;\n    font-weight: 600;\n    color: #64748B;\n    text-transform: uppercase;\n    letter-spacing: 0.04em;\n}\n.manual-wizard-review-value {\n    font-size: 14px;\n    font-weight: 600;\n    color: #0F172A;\n    margin-top: 2px;\n    word-break: break-word;\n}\n.manual-wizard-review-edit {\n    flex-shrink: 0;\n    font-size: 13px;\n    font-weight: 600;\n    color: #1E6FD9;\n    background: transparent;\n    border: none;\n    padding: 4px 0;\n    cursor: pointer;\n    text-decoration: underline;\n    text-underline-offset: 2px;\n}\n.manual-wizard-review-edit:hover {\n    color: #1557B0;\n}\n.manual-wizard-dot.is-review.is-current {\n    background: #0F172A;\n    box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.18);\n}\n\n/* Bulk upload (teachers / students) — Wave DS */\n.manual-wizard-bulk-toolbar {\n    display: flex;\n    flex-wrap: wrap;\n    gap: 10px;\n    align-items: center;\n    margin-bottom: 12px;\n}\n.manual-wizard-bulk-link,\n.manual-wizard-bulk-upload {\n    font-size: 13px;\n    font-weight: 600;\n    color: #1E6FD9;\n    text-decoration: underline;\n    text-underline-offset: 2px;\n    cursor: pointer;\n}\n.manual-wizard-bulk-upload {\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n}\n.manual-wizard-bulk-list {\n    list-style: none;\n    margin: 0 0 14px;\n    padding: 0;\n    border: 1px solid #E2E8F0;\n    border-radius: 12px;\n    overflow: hidden;\n    background: #FFFFFF;\n}\n.manual-wizard-bulk-item {\n    display: flex;\n    align-items: flex-start;\n    justify-content: space-between;\n    gap: 10px;\n    padding: 10px 12px;\n    border-bottom: 1px solid #E2E8F0;\n}\n.manual-wizard-bulk-item:last-child {\n    border-bottom: none;\n}\n.manual-wizard-bulk-item-main {\n    display: flex;\n    flex-direction: column;\n    gap: 2px;\n    min-width: 0;\n}\n.manual-wizard-bulk-item-main strong {\n    font-size: 14px;\n    color: #0F172A;\n}\n.manual-wizard-bulk-meta {\n    font-size: 12px;\n    color: #64748B;\n}\n.manual-wizard-bulk-remove {\n    border: none;\n    background: transparent;\n    color: #94A3B8;\n    cursor: pointer;\n    font-size: 14px;\n    padding: 2px 4px;\n}\n.manual-wizard-bulk-remove:hover {\n    color: #DC2626;\n}\n.manual-wizard-bulk-divider {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    margin: 16px 0 12px;\n    color: #94A3B8;\n    font-size: 11px;\n    font-weight: 600;\n    text-transform: uppercase;\n    letter-spacing: 0.04em;\n}\n.manual-wizard-bulk-divider::before,\n.manual-wizard-bulk-divider::after {\n    content: \"\";\n    flex: 1;\n    height: 1px;\n    background: #E2E8F0;\n}\n\n/* ════════════════════════════════════════════════════════════════════\n   controls-v2.css — PROPOSED button + form additions (2026-09-27)\n   STATUS: PENDING REVIEW. Nothing here exists in the app CSS yet.\n   Every value is an existing token or a value already in dashboard-refresh.css.\n   Base rules (.ds-btn, .ds-form-input …) stay in classes.css, verbatim.\n   Review page: guidelines/component-review-buttons-forms.html\n   ════════════════════════════════════════════════════════════════════ */\n\n/* ── REAL, synced: .ds-btn-md exists upstream (contract-tested in\n   TableAndButtonClassContractTest) but was missing from this copy. ── */\n.ds-btn-md { padding: 8px 18px; font-size: 0.85rem; }\n\n/* ── Loading (NEW) — no loading state exists upstream. Label stays in place\n   so the button never changes width; a 14px ring is prepended. ── */\n.ds-btn.is-loading { pointer-events: none; cursor: progress; }\n.ds-btn-spinner {\n    width: 14px; height: 14px; flex-shrink: 0; box-sizing: border-box;\n    border: 2px solid currentColor; border-right-color: transparent;\n    border-radius: 999px;\n    animation: ds-btn-spin 0.7s linear infinite;\n}\n@keyframes ds-btn-spin { to { transform: rotate(360deg); } }\n@media (prefers-reduced-motion: reduce) {\n    .ds-btn-spinner { animation: none; border-right-color: currentColor; opacity: .55; }\n}\n\n/* ── Contrast fixes (PROPOSED — same correction already applied to --d-accent) ──\n   .ds-btn-success: white on #22C55E = 2.28:1 (fail).  hover #16a34a = 3.30:1 (fail).\n   .ds-btn-warning: white on #D97706 = 3.19:1 (fail). */\n/* .ds-btn-success — RETIRED as a distinct variant (decision 2026-09-27). The only\n   AA-passing green is #15803D, which is primary, so a separate name had no value.\n   The Button component maps variant=\"success\" to primary. --d-success stays as a\n   token for badges, alerts and status indicators. */\n.ds-btn-warning.v2 { background: var(--d-warning); border-color: var(--d-warning); color: var(--d-text-on-accent); }\n.ds-btn-warning.v2:hover { background: var(--d-warning-dk); border-color: var(--d-warning-dk); }\n\n/* Disabled: upstream stacks opacity .5 ON TOP of the muted bg/text, a double\n   dim. Proposed: drop the opacity, keep the tokens. */\n.ds-btn.v2:disabled, .ds-btn.v2.disabled { opacity: 1; }\n\n/* ── Forms ── */\n/* Touch target: inputs render ~37px tall (9px padding × 2 + 0.85rem line + 2px border);\n   the 44px rule covers buttons and table links but never form controls. */\n.ds-form-input.v2, .ds-form-select.v2 { min-height: var(--d-touch-target-min); box-sizing: border-box; }\n.ds-form-textarea.v2 { min-height: 96px; resize: vertical; line-height: 1.5; box-sizing: border-box; }\n\n/* Focus: upstream uses a CLAY glow rgba(201,100,66,.15) — Toshi's colour leaking\n   into app forms. Proposed: the system's own --d-focus-ring (blue, as buttons use). */\n.ds-form-input.v2:focus, .ds-form-select.v2:focus, .ds-form-textarea.v2:focus {\n    border-color: var(--d-blue); box-shadow: var(--d-focus-ring);\n}\n.ds-form-input-error.v2, .ds-form-input-error.v2:focus { border-color: var(--d-red); }\n.ds-form-input-error.v2:focus { box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.20); }\n\n.ds-form-input.v2:disabled, .ds-form-select.v2:disabled, .ds-form-textarea.v2:disabled {\n    background: var(--d-disabled-bg); color: var(--d-disabled); cursor: not-allowed; border-color: var(--d-border);\n}\n.ds-form-input.v2[readonly] { background: var(--d-surface); }\n\n/* Help text: --d-muted #94A3B8 on white = 2.56:1 (fail). --d-text-secondary = 4.76:1. */\n.ds-form-help.v2 { color: var(--d-text-secondary); }\n\n/* ── Checkbox / radio (NEW family) — extends the only real checkbox, .dt-checkbox\n   (18px, accent-color --d-blue). The whole row is the 44px hit target. ── */\n.ds-check {\n    display: inline-flex; align-items: center; gap: 10px;\n    min-height: var(--d-touch-target-min);\n    font-family: var(--d-font-body); font-size: 0.85rem; color: var(--d-text);\n    cursor: pointer;\n}\n.ds-check input {\n    width: 18px; height: 18px; min-width: 18px; margin: 0;\n    accent-color: var(--d-blue); cursor: pointer;\n}\n.ds-check input:focus-visible { outline: 2px solid var(--d-blue); outline-offset: 2px; }\n.ds-check.is-disabled { color: var(--d-disabled); cursor: not-allowed; }\n.ds-check.is-disabled input { cursor: not-allowed; }\n.ds-check-group { display: flex; flex-direction: column; gap: 0; }\n.ds-check-group--inline { flex-direction: row; flex-wrap: wrap; column-gap: 20px; }\n\n/* ── Legacy .tw-form-control → unified input (DECIDED 2026-09-27) ──\n   superadmin-app.blade.php inlines .tw-form-control{border:1px solid #9ca3af!important;\n   border-radius:.25rem!important;font-size:.875rem!important}. No comment, doc or\n   decision record explains it (searched source + docs/; the \"D2\" in the SiteAdmin\n   header comment is the header variant, unrelated). Treated as an accidental patch:\n   delete the inline block and let the legacy class take the unified metrics. */\n.tw-form-control.v2 {\n    width: 100%; min-height: var(--d-touch-target-min); box-sizing: border-box;\n    padding: 9px 14px; border: 1px solid var(--d-border-strong); border-radius: 8px;\n    font-family: var(--d-font-body); font-size: 0.85rem; color: var(--d-text); background: var(--d-white);\n    transition: border-color 0.15s ease, box-shadow 0.15s ease; outline: none;\n}\n.tw-form-control.v2:focus { border-color: var(--d-blue); box-shadow: var(--d-focus-ring); }\n\n/* ════════════════════════════════════════════════════════════════════\n   tables-v2.css — PROPOSED data-table layer (2026-09-27)\n   STATUS: PENDING REVIEW. Builds on the real .ds-table-ledger / .dt-* rules in\n   classes.css (verbatim from dashboard-refresh.css) — nothing there is changed.\n   Upstream has sort arrows, density toggle, pagination and a mobile card layout,\n   but NO search, filter, active-filter chips, bulk-action bar or loading rows.\n   Review page: guidelines/component-review-tables.html\n   ════════════════════════════════════════════════════════════════════ */\n\n/* ── Contrast fixes on existing rules (opt-in .v2) ──\n   th / pagination info / empty-state desc / mobile card labels all use --d-muted\n   #94A3B8 = 2.57:1 on white (fail). --d-text-secondary = 4.76:1. */\n.ds-table-ledger.v2 th { color: var(--d-text-secondary); }\n.ds-table-ledger.v2 th[aria-sort=\"ascending\"], .ds-table-ledger.v2 th[aria-sort=\"descending\"] { color: var(--d-blue); }\n.ds-table-ledger.v2 th[aria-sort=\"ascending\"] .dt-sort-arrow, .ds-table-ledger.v2 th[aria-sort=\"descending\"] .dt-sort-arrow { color: var(--d-blue); }\n.ds-table-ledger.v2 th[aria-sort=\"ascending\"] .dt-sort-arrow { transform: rotate(180deg); }\n.ds-table-ledger.v2 th:focus-visible { outline: 2px solid var(--d-blue); outline-offset: -2px; }\n.ds-table-ledger.v2 th.dt-cell-num { text-align: right; }\n.dt-pagination.v2, .dt-pagination.v2 .dt-pagination-info { color: var(--d-text-secondary); }\n.ds-table-empty.v2 .ds-empty-state-desc { color: var(--d-text-secondary); }\n@media (max-width: 767px) {\n    .ds-table-card-mobile.v2 td::before { color: var(--d-text-secondary); font-size: 0.72rem; }\n}\n\n/* ── Toolbar (NEW) ── */\n/* Every toolbar piece sets `display`, which outranks the UA [hidden] rule — restore it. */\n.dt-toolbar[hidden], .dt-bulkbar[hidden], .dt-chips[hidden], .dt-search-clear[hidden] { display: none !important; }\n.ds-table-ledger.v2 .dt-cell-num { white-space: nowrap; }\n.dt-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }\n.dt-toolbar-start, .dt-toolbar-end { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }\n.dt-toolbar-start { flex: 1 1 420px; }\n\n.dt-search { position: relative; flex: 1 1 240px; max-width: 360px; }\n.dt-search .ds-form-input { padding-left: 38px; padding-right: 44px; }\n.dt-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--d-text-secondary); pointer-events: none; }\n.dt-search-clear {\n    position: absolute; right: 0; top: 0; width: 44px; height: 44px;\n    display: inline-flex; align-items: center; justify-content: center;\n    border: 0; background: transparent; color: var(--d-text-secondary); cursor: pointer; border-radius: 8px;\n}\n.dt-search-clear:hover { color: var(--d-text); }\n.dt-search-clear:focus-visible { outline: 2px solid var(--d-blue); outline-offset: -2px; }\n.dt-filter { width: auto; min-width: 150px; }\n\n/* Active-filter chips: 30px pill, 44px hit area */\n.dt-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: -4px 0 8px; }\n.dt-chip { min-height: 44px; display: inline-flex; align-items: center; padding: 0; border: 0; background: none; cursor: pointer; font: inherit; }\n.dt-chip > span {\n    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 12px;\n    border-radius: 999px; background: #EFF6FF; color: #1D4ED8;\n    font-family: var(--d-font-body); font-size: 0.78rem; font-weight: 500;\n    transition: background 0.15s ease;\n}\n.dt-chip:hover > span { background: #DBEAFE; }\n.dt-chip:focus-visible > span { outline: 2px solid var(--d-blue); outline-offset: 2px; }\n.dt-chip svg { width: 12px; height: 12px; }\n.dt-chip-clear { min-height: 44px; border: 0; background: none; padding: 0 4px; color: var(--d-blue); font: 500 0.78rem var(--d-font-body); cursor: pointer; }\n.dt-chip-clear:hover { text-decoration: underline; }\n\n.dt-result-count { font-family: var(--d-font-body); font-size: 0.8rem; color: var(--d-text-secondary); }\n\n/* ── Bulk-action bar (NEW) — replaces the toolbar while rows are selected ── */\n.dt-bulkbar {\n    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;\n    min-height: 60px; padding: 8px 8px 8px 16px; margin-bottom: 12px;\n    background: var(--d-dark); color: #F8FAFC; border-radius: 10px;\n    font-family: var(--d-font-body); font-size: 0.85rem;\n}\n.dt-bulkbar-count { font-weight: 600; margin-right: auto; }\n.dt-bulkbar .ds-btn-ghost { color: var(--d-dark-fg); }\n.dt-bulkbar .ds-btn-ghost:hover { background: var(--d-dark-surface); color: #FFFFFF; }\n\n/* ── Loading rows — the shimmer (.dt-skel) and refresh bar (.dt-busy) now live in\n   feedback-v2.css as the general .ds-skel / .ds-busy pattern; dt-* are aliases. ── */\n.ds-table-ledger tbody tr.dt-loading-row:hover { background: none; box-shadow: none; }\n\n/* Student cell: name + admission number */\n.dt-person { display: flex; flex-direction: column; gap: 2px; }\n.dt-person b { font-weight: 600; color: var(--d-text); }\n.dt-person small { font-size: 0.78rem; color: var(--d-text-secondary); font-variant-numeric: tabular-nums; }\n\n@media (max-width: 767px) {\n    .dt-toolbar-start, .dt-toolbar-end { flex: 1 1 100%; }\n    .dt-search { max-width: none; flex-basis: 100%; }\n    .dt-filter { flex: 1 1 140px; }\n}\n\n/* ════════════════════════════════════════════════════════════════════\n   feedback-v2.css — PROPOSED empty, loading, chart-state, dialog and toast layer\n   STATUS: PENDING REVIEW (2026-09-27). Extends real rules — .ds-empty-state*,\n   .ds-loading-dot, .ds-chart-shell / .ds-chart-empty — without changing them.\n   Review pages: guidelines/component-review-{states,charts,dialogs}.html\n   ════════════════════════════════════════════════════════════════════ */\n\n/* ───────────── 1. LOADING — one pattern for every component ─────────────\n   Three tools, picked by what the user already has on screen:\n     nothing yet      → .ds-skel placeholders shaped like the content\n     content, stale   → .ds-busy 2px bar along the top; content stays put\n     an action        → .ds-btn.is-loading (controls-v2.css)\n   .ds-loading-dot (real) stays for inline \"Toshi is typing\"-style waits only. */\n.ds-skel, .dt-skel {\n    display: block; height: 12px; border-radius: 6px;\n    background: linear-gradient(90deg, #F1F5F9 0%, #E2E8F0 50%, #F1F5F9 100%);\n    background-size: 200% 100%; animation: ds-shimmer 1.2s linear infinite;\n}\n.ds-skel--title { height: 16px; width: 55%; }\n.ds-skel--text { height: 10px; }\n.ds-skel--kpi { height: 28px; width: 40%; border-radius: 8px; }\n.ds-skel--pill { height: 24px; width: 64px; border-radius: 999px; }\n.ds-skel--block { height: 100%; min-height: 120px; border-radius: 12px; }\n.ds-skel-stack { display: flex; flex-direction: column; gap: 10px; }\n@keyframes ds-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }\n\n.ds-busy, .dt-busy { position: relative; }\n.ds-busy::after, .dt-busy::after {\n    content: \"\"; position: absolute; left: 0; right: 0; top: 0; height: 2px; z-index: 3;\n    background: linear-gradient(90deg, transparent, var(--d-blue), transparent);\n    background-size: 50% 100%; background-repeat: no-repeat; animation: ds-bar 1s linear infinite;\n}\n@keyframes ds-bar { from { background-position: -50% 0; } to { background-position: 150% 0; } }\n@media (prefers-reduced-motion: reduce) {\n    .ds-skel, .dt-skel { animation: none; background: #EEF2F6; }\n    .ds-busy::after, .dt-busy::after { animation: none; background: var(--d-blue); opacity: .4; }\n}\n\n/* ───────────── 2. EMPTY — .ds-empty-state (real) + .v2 ─────────────\n   Real rule: icon is a 2.5rem emoji/glyph at opacity .5; desc is --d-muted (2.57:1, fail).\n   v2: an Icon.jsx stroke glyph in a 48px tinted tile, AA desc colour, an actions row,\n   and three sizes so the same pattern fits a page, a card and a chart. */\n.ds-empty-state.v2 { padding: 48px 24px; gap: 0; }\n.ds-empty-state.v2 .ds-empty-state-desc { color: var(--d-text-secondary); max-width: 360px; line-height: 1.5; text-wrap: pretty; }\n.ds-empty-icon {\n    width: 48px; height: 48px; border-radius: 12px; margin-bottom: 14px;\n    display: inline-flex; align-items: center; justify-content: center;\n    background: var(--d-disabled-bg); color: var(--d-text-secondary);\n}\n.ds-empty-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n.ds-empty-icon--blue { background: #EFF6FF; color: var(--d-blue); }\n.ds-empty-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }\n.ds-empty-state.v2.is-compact { padding: 28px 16px; }\n.ds-empty-state.v2.is-compact .ds-empty-icon { width: 40px; height: 40px; margin-bottom: 10px; }\n.ds-empty-state.v2.is-compact .ds-empty-state-title { font-size: 0.9rem; }\n.ds-empty-state.v2.is-inline { flex-direction: row; text-align: left; align-items: center; padding: 14px 16px; gap: 14px; }\n.ds-empty-state.v2.is-inline .ds-empty-icon { margin: 0; flex-shrink: 0; width: 40px; height: 40px; }\n.ds-empty-state.v2.is-inline .ds-empty-actions { margin: 0 0 0 auto; }\n\n/* ───────────── 3. CHART STATES — around the real .ds-chart-shell ─────────────\n   <x-chart> already swaps the canvas for .ds-chart-empty when every dataset is 0/null.\n   v2 adds a loading skeleton sized to the shell, and an accessible series palette. */\n.ds-chart-card { background: var(--d-white); border-radius: 14px; box-shadow: var(--d-shadow-sm); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }\n.ds-chart-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }\n.ds-chart-title { font-family: var(--d-font-display); font-size: 1rem; font-weight: 600; margin: 0; color: var(--d-text); }\n.ds-chart-sub { font-size: 0.78rem; color: var(--d-text-secondary); margin: 2px 0 0; }\n.ds-chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.78rem; color: var(--d-text-secondary); list-style: none; margin: 0; padding: 0; }\n.ds-chart-legend li { display: inline-flex; align-items: center; gap: 6px; }\n.ds-chart-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }\n.ds-chart-skel { display: flex; align-items: flex-end; gap: 10px; height: 100%; padding: 8px 4px 0; }\n.ds-chart-skel .ds-skel { flex: 1; border-radius: 6px 6px 0 0; }\n.ds-chart-skel--ring { align-items: center; justify-content: center; }\n.ds-chart-skel--ring .ds-skel { flex: none; width: 160px; height: 160px; border-radius: 999px; -webkit-mask: radial-gradient(circle, transparent 52px, #000 53px); mask: radial-gradient(circle, transparent 52px, #000 53px); }\n\n/* ───────────── 4. DIALOG — replaces swal v1, SweetAlert2 and ad-hoc Alpine modals ─────────────\n   Native <dialog> (focus trap, Esc, ::backdrop for free). Actions are real .ds-btn. */\n.ds-dialog { border: 0; padding: 0; border-radius: 16px; background: var(--d-white); color: var(--d-text); width: min(440px, calc(100vw - 32px)); box-shadow: var(--d-shadow-float); font-family: var(--d-font-body); }\n.ds-dialog--wide { width: min(560px, calc(100vw - 32px)); }\n.ds-dialog::backdrop { background: rgba(15, 23, 42, 0.45); }\n.ds-dialog[open] { animation: ds-dialog-in 0.2s ease; }\n@keyframes ds-dialog-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }\n@media (prefers-reduced-motion: reduce) { .ds-dialog[open] { animation: none; } }\n.ds-dialog-body { padding: 24px 24px 8px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start; }\n.ds-dialog-body--plain { grid-template-columns: 1fr; }\n.ds-dialog-icon { grid-row: span 2; width: 40px; height: 40px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; }\n.ds-dialog-icon svg { width: 20px; height: 20px; fill: no \n.ds-toast {\n    pointer-events: auto; display: grid; grid-template-columns: auto 1fr auto; align-items: start; gap: 10px;\n    padding: 12px 4px 12px 14px; border-radius: 12px; background: var(--d-dark); color: #F8FAFC;\n    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18); font-family: var(--d-font-body); font-size: 0.85rem; line-height: 1.45;\n    animation: ds-toast-in 0.2s ease;\n}\n.ds-toast-icon { width: 20px; height: 20px; margin-top: 1px; }\n.ds-toast-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n.ds-toast--success .ds-toast-icon { color: #4ADE80; }\n.ds-toast--error .ds-toast-icon { color: #F87171; }\n.ds-toast--warning .ds-toast-icon { color: #FBBF24; }\n.ds-toast--info .ds-toast-icon { color: #60A5FA; }\n.ds-toast-title { font-weight: 600; margin: 0; }\n.ds-toast-text { margin: 2px 0 0; color: var(--d-dark-fg); }\n.ds-toast-action { display: inline-flex; align-items: center; background: none; border: 0; padding: 0; margin-top: 2px; color: #93C5FD; font: 600 0.85rem var(--d-font-body); cursor: pointer; min-height: var(--d-touch-target-min); }\n.ds-toast-action:hover { text-decoration: underline; }\n.ds-toast-close { width: 44px; height: 44px; border: 0; background: transparent; color: var(--d-muted); border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin: -10px 0 -10px 0; }\n.ds-toast-close:hover { color: #FFFFFF; background: var(--d-dark-surface); }\n.ds-toast-close svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }\n.ds-toast.is-leaving { opacity: 0; transform: translateY(6px); transition: opacity .2s ease, transform .2s ease; }\n@keyframes ds-toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n@media (prefers-reduced-motion: reduce) { .ds-toast { animation: none; } .ds-toast.is-leaving { transition: none; } }\n@media (max-width: 640px) { .ds-toasts { left: 16px; right: 16px; bottom: 16px; width: auto; } }\n\n/* Inline alert — for messages that must stay on the page (never a toast) */\n.ds-inline-alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; font-size: 0.85rem; line-height: 1.5; border: 1px solid; }\n.ds-inline-alert svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }\n.ds-inline-alert b { font-weight: 600; }\n.ds-inline-alert--warning { background: #FFFBEB; border-color: #FDE68A; color: var(--d-warning-dk); }\n.ds-inline-alert--error { background: #FEF2F2; border-color: #FECACA; color: #991B1B; }\n.ds-inline-alert--success { background: #F0FDF4; border-color: #BBF7D0; color: var(--d-success-dk); }\n.ds-inline-alert--info { background: #EFF6FF; border-color: #BFDBFE; color: #1D4ED8; }\n\n<\u002Fstyle>\n<style>\nbody{margin:0;background:var(--d-canvas);font-family:var(--d-font-body);color:var(--d-text)}\n.wrap{max-width:1280px;margin:0 auto;padding:40px 24px 64px}\n.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--d-muted);margin:0 0 10px}\nh1{font-family:var(--d-font-display);font-size:2.1rem;font-weight:700;letter-spacing:-.02em;color:var(--d-dark);margin:0 0 8px;line-height:1.1}\n.lede{font-size:1rem;color:var(--d-text-secondary);margin:0;max-width:62ch;line-height:1.6}\n.stage{margin:28px 0 0;background:var(--d-white);border:1px solid var(--d-border);border-radius:20px;box-shadow:0 0 0 1px var(--d-border);overflow:hidden}\n.stage svg{display:block;width:100%;height:auto}\n.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;padding:22px 28px 0;border-top:1px solid var(--d-border)}\n.legend.cores{border-top:0;padding:16px 28px 26px}\n.leg-item{display:flex;gap:11px;align-items:flex-start}\n.leg-cube{width:22px;heigh 2V80z\"><\u002Fpath><path fill=\"#36C5F0\" d=\"M47 27c-7.3 0-13.2-5.9-13.2-13.2C33.8 6.5 39.7.6 47 .6c7.3 0 13.2 5.9 13.2 13.2V27H47zm0 6.7c7.3 0 13.2 5.9 13.2 13.2 0 7.3-5.9 13.2-13.2 13.2H13.9C6.6 60.1.7 54.2.7 46.9c0-7.3 5.9-13.2 13.2-13.2H47z\"><\u002Fpath><path fill=\"#2EB67D\" d=\"M99.9 46.9c0-7.3 5.9-13.2 13.2-13.2 7.3 0 13.2 5.9 13.2 13.2 0 7.3-5.9 13.2-13.2 13.2H99.9V46.9zm-6.6 0c0 7.3-5.9 13.2-13.2 13.2-7.3 0-13.2-5.9-13.2-13.2V13.8C66.9 6.5 72.8.6 80.1.6c7.3 0 13.2 5.9 13.2 13.2v33.1z\"><\u002Fpath><path fill=\"#ECB22E\" d=\"M80.1 99.8c7.3 0 13.2 5.9 13.2 13.2 0 7.3-5.9 13.2-13.2 13.2-7.3 0-13.2-5.9-13.2-13.2V99.8h13.2zm0-6.6c-7.3 0-13.2-5.9-13.2-13.2 0-7.3 5.9-13.2 13.2-13.2h33.1c7.3 0 13.2 5.9 13.2 13.2 0 7.3-5.9 13.2-13.2 13.2H80.1z\"><\u002Fpath><\u002Fg><\u002Fg>\n<\u002Fg>\n\n<\u002Fsvg>\n\n<div class=\"legend\">\n<div class=\"leg-item\"><span class=\"leg-cube\" style=\"background:#c96442\"><\u002Fspan><div><p class=\"leg-name\">Toshi<\u002Fp><p class=\"leg-sub\">Top block, floating clear of the stack, marked with the K. Clay palette, kept out of the core brand on purpose.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"leg-item\"><span class=\"leg-cube\" style=\"background:#22C55E\"><\u002Fspan><div><p class=\"leg-name\">KlassApp core<\u002Fp><p class=\"leg-sub\">Students, fees, marks, reports. Tallest block in the stack — dominant by height.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"leg-item\"><span class=\"leg-cube\" style=\"background:#1E293B\"><\u002Fspan><div><p class=\"leg-name\">Protocol<\u002Fp><p class=\"leg-sub\">The slab everything rests on. Open, interoperable, community-run.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"leg-item\"><span class=\"leg-cube\" style=\"background:#FFFFFF;border:1px solid #E2E8F0\"><\u002Fspan><div><p class=\"leg-name\">WhatsApp · Google Drive · Slack<\u002Fp><p class=\"leg-sub\">The integrated tools, kept inside the core and surfacing one at a time on its faces, on their real official marks.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"legend cores\">\n<div class=\"leg-item\"><span class=\"leg-cube\" style=\"background:#FFFFFF;border:1px solid #CBD5E1\"><\u002Fspan><div><p class=\"leg-name\">Open Source<\u002Fp><p class=\"leg-sub\">Left core on the slab. The substrate is inspectable.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"leg-item\"><span class=\"leg-cube\" style=\"background:#FFFFFF;border:1px solid #CBD5E1\"><\u002Fspan><div><p class=\"leg-name\">MCP Compatible<\u002Fp><p class=\"leg-sub\">Front core. Toshi and third parties speak the same protocol.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<div class=\"leg-item\"><span class=\"leg-cube\" style=\"background:#FFFFFF;border:1px solid #CBD5E1\"><\u002Fspan><div><p class=\"leg-name\">Community-Driven<\u002Fp><p class=\"leg-sub\">Right core. Schools extend it, not just consume it.<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h2>Handoff spec<\u002Fh2>\n<div class=\"spec\">\n\n<div class=\"card\"><h3>Isometric projection<\u002Fh3>\n<p>2:1 dimetric — every face angle is <code>±26.57°<\u002Fcode> (<code>slope 0.5<\u002Fcode>). One rule generates the whole scene, so new blocks stay consistent:<\u002Fp>\n<ul>\n<li>Top face: <code>(cx−W,cy) (cx,cy−W/2) (cx+W,cy) (cx,cy+W/2)<\u002Fcode><\u002Fli>\n<li>Left face: drops <code>H<\u002Fcode> from the left and bottom vertices<\u002Fli>\n<li>Right face: drops <code>H<\u002Fcode> from the bottom and right vertices<\u002Fli>\n<li>Stacking: a block resting on another has <code>cy = cy_below − H_self<\u002Fcode><\u002Fli>\n<\u002Ful>\n<p>Blocks: protocol <code>cy 660 · W 250 · H 54<\u002Fcode>, core <code>cy 560 · W 160 · H 100<\u002Fcode>, Toshi <code>cy 468 · W 120 · H 58<\u002Fcode> (34px float gap above the core). <b>The core is dominant by height, not width<\u002Fb> — it is the tallest block, while staying narrow enough that the slab keeps a 90px exposed margin for the three protocol cores to sit on. Widen the core and they disappear behind it.<\u002Fp><\u002Fdiv>\n\n<div class=\"card\"><h3>Face shading — flat, no gradients<\u002Fh3>\n<p>Depth comes from three flat tones per block, not gradients. That is deliberate: the system has exactly one gradient (the admin LIVE badge), so an illustration full of them would read as foreign.<\u002Fp>\n<table><thead><tr><th>Layer<\u002Fth><th>Top<\u002Fth><th>Left<\u002Fth><th>Right<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td>Protocol<\u002Ftd><td><span class=\"sw\" style=\"background:#334155\"><\u002Fspan>#334155<\u002Ftd><td><span class=\"sw\" style=\"background:#1E293B\"><\u002Fspan>#1E293B<\u002Ftd><td><span class=\"sw\" style=\"background:#0F172A\"><\u002Fspan>#0F172A<\u002Ftd><\u002Ftr>\n<tr><td>Core<\u002Ftd><td><span class=\"sw\" style=\"background:#4ADE80\"><\u002Fspan>#4ADE80<\u002Ftd><td><span class=\"sw\" style=\"background:#22C55E\"><\u002Fspan>#22C55E<\u002Ftd><td><span class=\"sw\" style=\"background:#16A34A\"><\u002Fspan>#16A34A<\u002Ftd><\u002Ftr>\n<tr><td>Toshi<\u002Ftd><td><span class=\"sw\" style=\"background:#f5f4ed\"><\u002Fspan>#f5f4ed<\u002Ftd><td><span class=\"sw\" style=\"background:#c96442\"><\u002Fspan>#c96442<\u002Ftd><td><span class=\"sw\" style=\"background:#a84d32\"><\u002Fspan>#a84d32<\u002Ftd><\u002Ftr>\n<tr><td>Cores<\u002Ftd><td><span class=\"sw\" style=\"background:#FFFFFF;border:1px solid #CBD5E1\"><\u002Fspan>#FFFFFF<\u002Ftd><td><span class=\"sw\" style=\"background:#E2E8F0\"><\u002Fspan>#E2E8F0<\u002Ftd><td><span class=\"sw\" style=\"background:#CBD5E1\"><\u002Fspan>#CBD5E1<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<p>Every value is an existing token — <code>--d-dark-border/-surface/--d-dark<\u002Fcode>, <code>--d-accent-lt/--d-green/--d-accent-dk<\u002Fcode>, <code>--toshi-warm-bg/--toshi-accent/--toshi-accent-hover<\u002Fcode>, <code>--d-white/--d-border/--d-border-strong<\u002Fcode>. Nothing was mixed or invented.<\u002Fp><\u002Fdiv>\n\n<div class=\"card\"><h3>Surfacing from inside the cube — the mechanic<\u002Fh3>\n<p><b>The icons belong to the cube, not to a ring around it.<\u002Fb> Each one grows out of a face centre, holds long enough to be read, then sinks back into the solid — and <b>only one is out at a time per cube<\u002Fb>, so there is never a crowd to scan. The two visible faces alternate: left, then right, then left.<\u002Fp>\n<p>Core block, <code>12s linear<\u002Fcode>, three tools at <code>4s<\u002Fcode> steps. Emergence anchors are the true centroids of the two visible faces — <code>540,650<\u002Fcode> (left) and <code>700,650<\u002Fcode> (right):<\u002Fp>\n<table><thead><tr><th>Phase<\u002Fth><th>Scale<\u002Fth><th>Opacity<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td>0% — inside the solid<\u002Ftd><td><code>0.25<\u002Fcode><\u002Ftd><td><code>0<\u002Fcode><\u002Ftd><\u002Ftr>\n<tr><td>3% — breaks the surface<\u002Ftd><td><code>1.06<\u002Fcode><\u002Ftd><td><code>1<\u002Fcode><\u002Ftd><\u002Ftr>\n<tr><td>5% — settles<\u002Ftd><td><code>1.00<\u002Fcode><\u002Ftd><td><code>1<\u002Fcode><\u002Ftd><\u002Ftr>\n<tr><td>29% — held for reading<\u002Ftd><td><code>1.00<\u002Fcode><\u002Ftd><td><code>1<\u002Fcode><\u002Ftd><\u002Ftr>\n<tr><td>33% — back inside<\u002Ftd><td><code>0.25<\u002Fcode><\u002Ftd><td><code>0<\u002Fcode><\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<p>The <code>1.06<\u002Fcode> overshoot is the whole trick: a linear scale-up reads as a tile fading in, while a slight overshoot settling back to <code>1<\u002Fcode> reads as something <i>pushed out<\u002Fi> from within. <code>transform-box: fill-box<\u002Fcode> with <code>transform-origin: 50% 50%<\u002Fcode> makes each tile scale about its own centre — without it, CSS scales SVG groups about the <b>viewBox<\u002Fb> centre and the tile slides across the illustration as it shrinks.<\u002Fp>\n<p><b>Emerged tiles must stay inside their face's silhouette<\u002Fb> — that is what makes them read as sitting on the solid rather than floating beside it. Core tiles clear it easily: a 56px tile on the core's left face spans <code>y 622–678<\u002Fcode> inside a <code>614–686<\u002Fcode> band, and the core block does not bob.<\u002Fp>\n<p><b>The Toshi tiles are the tight case, because that block bobs.<\u002Fb> For a 32px tile spanning <code>x 544–576<\u002Fcode>, the face's usable band is bounded by its top edge at the tile's <b>right<\u002Fb> x (<code>506<\u002Fcode>, not the 489.5 you get from the left x — use the binding corner) and its bottom edge at the tile's <b>left<\u002Fb> x (<code>548<\u002Fcode>): a 42px band. The <code>-7px<\u002Fcode> bob consumes 7 of that, leaving <b>35px<\u002Fb>, so the tiles are <b>32×32<\u002Fb> at local offset <code>y +3.5<\u002Fcode> (rendered centre <code>530.5<\u002Fcode>) — about 1.5px of slack at both bob extremes. They previously sat at the centroid (offset 0) at 34×34, which had 3.5px of margin at rest and went <b>3.5px outside the face at the bob peak<\u002Fb>. <b>Model tiles carry no ground shadow<\u002Fb> for the same reason the removed text pill didn't: there is no vertical room for one inside the face.<\u002Fp>\n<p><b>The real constraint is the slant, not a half-width budget.<\u002Fb> An earlier version of this note said a tile just had to stay inside the face's 120px half-width — that is wrong and it produced a real bug (a 70×34 pill overhanging the clay face by 11px). The face is a <b>parallelogram of 58px vertical thickness with slope 0.5<\u002Fb>, so a tile of width <var>w<\u002Fvar> loses <code>w/2<\u002Fcode> of that thickness to the drop across its own span. The usable band for a tile spanning <code>x 525–595<\u002Fcode> is only <b>23px<\u002Fb>, and the <code>-7px<\u002Fcode> bob eats a further 7, leaving <b>16px<\u002Fb>. So: a 34px-tall tile can be at most <b>48px wide<\u002Fb>; a 70px-wide tile at most <b>16px tall<\u002Fb>. <code>70×34<\u002Fcode> does not fit anywhere on this face at any position.<\u002Fp>\n<p><b>Before shipping any change to a tile's size, re-run the corner test:<\u002Fb> four corners, evaluated at <b>both<\u002Fb> <code>b=0<\u002Fcode> and <code>b=-7<\u002Fcode>, point-in-polygon against that face's quad — <code>M500 468 L620 528 L620 586 L500 526<\u002Fcode> (left) and <code>M620 528 L740 468 L740 526 L620 586<\u002Fcode> (right, which mirrors to the same band). Do not substitute a width-only check, do not measure the top edge at the wrong x, and do not test at rest only: every regression on this card so far has been one of those three shortcuts.<\u002Fp>\n<p><b>Measured:<\u002Fb> never more than <b>one visible per cube<\u002Fb> across a full cycle, landing exactly on <code>540,650<\u002Fcode> / <code>700,650<\u002Fcode> and <code>560,527<\u002Fcode> / <code>680,527<\u002Fcode>. There is a deliberate beat between hand-offs, and it is worth stating exactly because it looks like a bug when you sample it: each cube is <b>empty for ~0.45s<\u002Fb> between tiles. Derived from the keyframes rather than eyeballed — the core's opacity clears <code>0.5<\u002Fcode> from <code>1.5%<\u002Fcode> to <code>31%<\u002Fcode> of <code>12s<\u002Fcode> (3.54s visible, slots every 4s), the models' from <code>1.17%<\u002Fcode> to <code>15.35%<\u002Fcode> of <code>18s<\u002Fcode> (2.55s visible, slots every 3s). Sampling on a 1.2s timer against a 3s slot aliases straight into that gap and will report the cube bare in half your samples; that is the sampler, not the animation. Shorten the gap by extending the hold (<code>12%<\u002Fcode> → <code>13.5%<\u002Fcode>), never by overlapping two tiles.<\u002Fp>\n<p>The earlier orbit, its dashed track rings and the long routed connector lines are all <b>gone<\u002Fb>. Do not reinstate them: a ring drawn around the block contradicts the idea that the tools are <i>inside<\u002Fi> it.<\u002Fp><\u002Fdiv>\n\n<div class=\"card\"><h3>The tool tiles<\u002Fh3>\n<p><b>Upright, never skewed<\u002Fb> — a tile scales and fades but is never rotated or sheared, so the marks stay square to the viewer at every phase. 56×56, <code>radius 13<\u002Fcode>, <code>--d-white<\u002Fcode> fill, <code>1px --d-border<\u002Fcode> — same hairline-ring language as <code>.ds-card<\u002Fcode>, sized down from the old static 88×88 because three of them now share the hub's footprint.<\u002Fp>\n<p>Each tile is drawn centred on its own origin (<code>x/y −28<\u002Fcode>) so one <code>translate()<\u002Fcode> keyframe positions it. Draw order puts the tile group <b>after<\u002Fb> the core block, so a tile on a visible face paints on top of that face — reading as mounted on the solid.<\u002Fp>\n<p>The marks are the real official SVGs from <code>assets/brand/<\u002Fcode>, <b>inlined verbatim<\u002Fb> — path data untouched, each wrapped in <code>translate(-20 -20) scale()<\u002Fcode> to land at 40px centred on the tile (WhatsApp <code>0.228291<\u002Fcode>, Drive <code>0.458191<\u002Fcode>, Slack <code>0.314964<\u002Fcode> — the old 44px scales × <code>40/44<\u002Fcode>, so the path data itself was never retouched). Inlined rather than <code>&lt;image href&gt;<\u002Fcode> so there is no external fetch and the marks are real nodes. They sit on an <b>upright<\u002Fb> plane precisely so no isometric matrix distorts them — third-party marks must never be skewed, recoloured or monochromed.<\u002Fp>\n<p><b>Per-tile labels were dropped.<\u002Fb> A label under a surfacing tile crosses the dark slab and the green face, where <code>--d-text-secondary #64748B<\u002Fcode> fails contrast on both. The marks are self-identifying and the legend beneath names all three — no moving text.<\u002Fp><\u002Fdiv>\n\n<div class=\"card\"><h3>Toshi's icon tile<\u002Fh3>\n<p>Toshi carries the real <b>K mark<\u002Fb> — <code>klassapp-icon.svg<\u002Fcode>, inlined verbatim including its five brand gradients, scaled <code>0.022<\u002Fcode> (2000 → 44px).<\u002Fp>\n<p>It sits on a <b>64px upright tile<\u002Fb>, <code>radius 14<\u002Fcode>, <code>--d-white<\u002Fcode> fill, <code>1px --toshi-border #e8e6dc<\u002Fcode> — the border token is Toshi's, not the app's, so the tile belongs to the clay layer it stands on.<\u002Fp>\n<p><b>Upright, never skewed.<\u002Fb> The tile's bottom edge lands exactly on the top face's centre <code>(620,468)<\u002Fcode> so it reads as standing on the surface, seated by an iso ellipse <code>rx 27 · ry 13.5<\u002Fcode> at <code>--toshi-accent-hover<\u002Fcode> <code>opacity .16<\u002Fcode>. The <code>rx:ry<\u002Fcode> 2:1 ratio is what makes the shadow lie flat on the plane.<\u002Fp>\n<p>It lives inside the <code>.float-toshi<\u002Fcode> group, so tile, shadow and block bob as one object.<\u002Fp><\u002Fdiv>\n\n<div class=\"card\"><h3>The models, on the Toshi cube<\u002Fh3>\n<p>Same mechanic one layer up, and deliberately so — the models belong <i>inside<\u002Fi> Toshi exactly as the tools belong inside the core. Anchors are the centroids of the Toshi block's two visible faces, <code>560,527<\u002Fcode> (left) and <code>680,527<\u002Fcode> (right). <code>18s linear<\u002Fcode>, six marks at <code>3s<\u002Fcode> steps, one out at a time.<\u002Fp>\n<p><b>The group sits inside <code>.float-toshi<\u002Fcode><\u002Fb>, so the marks bob with the block they live in rather than sliding against it. Nested CSS transforms compose cleanly: the tile's own <code>translate()<\u002Fcode> is in viewBox units and is unaffected by the parent's <code>translateY<\u002Fcode> bob.<\u002Fp>\n<p><b>The name pill it replaces is gone.<\u002Fb> Provider names cross-fading in a static pill were a stand-in for marks I did not have. <b>The K tile is untouched<\u002Fb> — 64px, <code>scale(0.022)<\u002Fcode>, still the only thing standing on the top face, and still the one mark that never retracts.<\u002Fp>\n<p>Tiles are <b>32×32<\u002Fb>, <code>radius 8<\u002Fcode>, <code>1px --toshi-border<\u002Fcode> — Toshi's border token, not the app's, so they read as belonging to the clay layer. Marks land in a 22px box; all six are the same size, with no special-cased tile.<\u002Fp><\u002Fdiv>\n\n<div class=\"card\"><h3>Motion<\u002Fh3>\n<p>All optional and all inside <code>@media (prefers-reduced-motion: no-preference)<\u002Fcode>.<\u002Fp>\n<ul>\n<li>Core tools surfacing: <code>12s linear infinite<\u002Fcode>, three tiles at <code>4s<\u002Fcode> steps — out for ~3.5s each, with a <code>1.06<\u002Fcode> overshoot on the way out<\u002Fli>\n<li>Toshi block: <code>translateY(−7px)<\u002Fcode> over <code>6s ease-in-out<\u002Fcode> — reinforces that it sits apart from the stack<\u002Fli>\n<li>Models surfacing: <code>18s linear infinite<\u002Fcode>, six marks at <code>3s<\u002Fcode> steps — out for ~2.55s each, same overshoot, on the Toshi block's own two faces<\u002Fli>\n<\u002Ful>\n<p>No bounce, no spring, no scale-up — consistent with the system's restrained motion. Note this illustration <b>adds<\u002Fb> the reduced-motion guard the product stylesheets still lack.<\u002Fp><\u002Fdiv>\n\n<div class=\"card\"><h3>Blade / CSS structure<\u002Fh3>\n<p>Ship as one inline <code>&lt;svg&gt;<\u002Fcode> partial, not an <code>&lt;img&gt;<\u002Fcode> — the marks need to be real nodes and the motion needs CSS reach.<\u002Fp>\n<ul>\n<li><code>resources/views/marketing/partials/layer-tower.blade.php<\u002Fcode><\u002Fli>\n<li><code>viewBox=\"216 380 808 518\"<\u002Fcode>, <code>width:100%; height:auto<\u002Fcode> — scales with no breakpoints<\u002Fli>\n<li>Keep <code>role=\"img\"<\u002Fcode> plus the <code>&lt;title&gt;<\u002Fcode>/<code>&lt;desc&gt;<\u002Fcode> pair; the tower carries real meaning<\u002Fli>\n<li>Face fills can move to <code>var(--d-…)<\u002Fcode> tokens once the marketing layout links the token sheet<\u002Fli>\n<li>Floor hairlines fade out through <code>mask=\"url(#floorMask)\"<\u002Fcode> — a mask, not a visible gradient fill, so the no-gradient rule above still holds. They are symmetric about <code>x=620<\u002Fcode>; never let one terminate outside the slab silhouette.<\u002Fli>\n<li>Below ~900px, drop the floor lines; the tiles sit inside the block footprint so nothing needs reflow, and the legend beneath carries all the naming<\u002Fli>\n<li>Both animations are pure CSS on <code>&lt;g&gt;<\u002Fcode> elements set to <code>transform-box: fill-box<\u002Fcode> so each tile scales about its own centre; <code>translate()<\u002Fcode> values stay viewBox user units — no JS, no <code>requestAnimationFrame<\u002Fcode>, nothing to tear down on navigation<\u002Fli>\n<li><b>The first frame must never be empty.<\u002Fb> <code>.orb-a<\u002Fcode> and <code>.mo-1<\u002Fcode> carry <b>negative<\u002Fb> delays (<code>-2s<\u002Fcode> / <code>-1.5s<\u002Fcode>) so each cube starts already mid-hold with one tile out. Without them both cubes render bare at <code>t=0<\u002Fcode> — and <code>t=0<\u002Fcode> is exactly what a card thumbnail, a PDF export and any screenshot capture. The remaining tiles are re-staggered off those phases (<code>2s/6s<\u002Fcode>; <code>1.5s…16.5s<\u002Fcode>) so the rhythm and the ~0.4s beat are unchanged. If you retime this, re-check the still frame, not just the loop.<\u002Fli>\n<li>Reduced motion: the base rules (<code>.orb-a<\u002Fcode>, <code>.mo-1<\u002Fcode> at <code>opacity:1<\u002Fcode>) park one tile per cube at full size on a face, so the motionless render is composed rather than empty<\u002Fli>\n<\u002Ful><\u002Fdiv>\n\n<\u002Fdiv>\n\n<div class=\"flag\"><h3>Resolved — the six model marks are in<\u002Fh3>\n<p>The real official SVGs were supplied and are now inlined from <code>assets/brand/models/&lt;name&gt;-mark.svg<\u002Fcode>: Anthropic, OpenAI, Grok (xAI), Gemini, Kimi (Moonshot) and Z.ai. Nothing was drawn, traced or recoloured — each mark's own path data and fills are untouched, wrapped only in a <code>translate() scale()<\u002Fcode> that centres it on its tile.<\u002Fp>\n<p><b>They arrived with C2PA provenance metadata and that has to be stripped.<\u002Fb> Every file carried an <code>&lt;metadata&gt;&lt;c2pa:manifest&gt;<\u002Fcode> block of base64 — 8–15 KB each, 54 KB across the seven files supplied, more than the entire rest of this page. Worse, it is fatal when inlined: the <code>xmlns:c2pa<\u002Fcode> namespace is declared on the file's own <code>&lt;svg&gt;<\u002Fcode> root, so lifting the children into this document leaves <code>c2pa:manifest<\u002Fcode> with an <b>unbound prefix<\u002Fb> and the whole SVG fails to parse. If you re-export these marks, strip the metadata block before inlining — or reference them with <code>&lt;img src&gt;<\u002Fcode>, where the root element survives and the namespace stays bound.<\u002Fp>\n<p><b>Per-provider scales<\u002Fb> (each computed from that file's real viewBox, to a 22px box): Anthropic <code>0.239130<\u002Fcode> · OpenAI <code>1.321321<\u002Fcode> · Grok <code>0.021484<\u002Fcode> · Gemini <code>0.785714<\u002Fcode> · Kimi <code>0.88<\u002Fcode> · Z.ai <code>0.733333<\u002Fcode>. Gemini and DeepSeek carry their own <code>&lt;defs&gt;<\u002Fcode> gradients, which are preserved — do not flatten them to a solid.<\u002Fp>\n<p><b>DeepSeek was cut from the set — six slots, not seven.<\u002Fb> The only artwork supplied for it is a <code>195.02 × 41.36<\u002Fcode> wordmark, aspect 4.7:1 against the others' ~1:1. Scaled into a tile it rendered at ~9.8px cap height and read as mush beside six crisp glyphs; a wider tile then failed the face-containment test (width and height trade off on this slant — a 70px-wide tile cannot exceed ~16px in height, so no square-ish wide tile fits), and the 70×14 capsule that did fit turned one slot into a text label among six logos. Each fix traded one defect for another, so the slot is gone rather than shipped broken.<\u002Fp>\n<p><b>To add it back:<\u002Fb> DeepSeek's <b>icon-only<\u002Fb> mark (the whale glyph without the wordmark) drops straight into a standard <code>32×32<\u002Fcode> tile at local offset <code>y +3.5<\u002Fcode>, at a scale computed like the other six, and the cycle returns to <code>21s<\u002Fcode> with <code>3s<\u002Fcode> steps and delays at <code>−1.5s … 16.5s<\u002Fcode>. Note that seven slots do <i>not<\u002Fi> alternate faces evenly — an odd count puts two consecutive tiles on the same side once per lap. Ask DeepSeek brand resources for the icon lockup; do not crop the wordmark down to its glyph.<\u002Fp><\u002Fdiv>\n\n<div class=\"flag\"><h3>Flagged — verify before this ships<\u002Fh3>\n<ul>\n<li><b>This composition was authored before any landing-page source existed.<\u002Fb> At the time, <code>ds-bundle<\u002Fcode> errored on every read and no marketing Blade was in the project, so the hub/connector diagram being replaced and the Protocol Cores section's real markup were never seen. <b>That has since changed<\u002Fb> — <code>uploads/landing-v2.blade.php.txt<\u002Fcode> and <code>uploads/landing-preview.css<\u002Fcode> were later supplied and read in full (the hero in <code>concepts/hero-role-rotate/<\u002Fcode> is built from them). <b>The tower has not yet been re-checked against that source.<\u002Fb> Do not re-request files that are already here; the open task is a diff, not an upload.<\u002Fli>\n<li><b>Consequence:<\u002Fb> layer <i>semantics<\u002Fi> and the three core names are exactly as you specified, and every colour, font and radius is a real token from this system — but the composition's fit against the live section (width, vertical rhythm, whether the legend beneath duplicates copy already on the page) is still unverified. Worth noting from the source that <i>was<\u002Fi> read: the landing page sets its own <code>--brand-*<\u002Fcode>/<code>--paper-*<\u002Fcode> tokens and ships no <code>--d-*<\u002Fcode> variables, so the token names quoted in these notes resolve in the app but not on the marketing page. Expect to retune spacing in Cursor.<\u002Fli>\n<li><b>The KlassApp mark now appears once<\u002Fb>, on Toshi's upright tile. The core block still carries no mark — the green <i>is<\u002Fi> the brand there. If you want the K on the core too, it goes on another upright tile, never skewed onto the iso plane.<\u002Fli>\n<li><b>Copy in the visual<\u002Fb> — the tile labels and the legend beneath (\"Clay palette, kept out of the core brand on purpose\", \"Students, fees, marks, reports\", \"Open, interoperable, community-run\") is written to the documented voice, not lifted from the page. Swap in the real section copy if it already says these things.<\u002Fli>\n<li><b>The KlassApp mark is absent by choice.<\u002Fb> The core block is the brand here. If you want the real logo on the core's top face, use <code>klassapp-icon.svg<\u002Fcode> upright on a floating tile rather than skewed onto the iso plane — the mark must not be distorted.<\u002Fli>\n<\u002Ful><\u002Fdiv>\n\n<h2>Separate deliverable — hero role rotation<\u002Fh2>\n<p class=\"lede\" style=\"margin-bottom:18px\">Not part of the tower. Two changes to the hero's rotating role mockup, specified here so both land in the same handoff.<\u002Fp>\n<div class=\"spec\">\n\n<div class=\"card\"><h3>Geometric flip on role change<\u002Fh3>\n<p>An <b>X-axis flip<\u002Fb> — the role panel hinges away top-to-bottom and the next one hinges in behind it, split-flap style. X rather than Y because the hinge axis then echoes the tower's stacked horizontal planes; a Y-axis spin reads as a carousel and fights that.<\u002Fp>\n<ul>\n<li>Container: <code>perspective: 900px<\u002Fcode><\u002Fli>\n<li>Panels: <code>transform-style: preserve-3d<\u002Fcode>, <code>backface-visibility: hidden<\u002Fcode>, <code>transform-origin: center<\u002Fcode><\u002Fli>\n<li>Outgoing: <code>rotateX(0) → rotateX(-90deg)<\u002Fcode>, opacity <code>1 → 0<\u002Fcode>, <code>0.3s ease<\u002Fcode><\u002Fli>\n<li>Incoming: <code>rotateX(90deg) → rotateX(0)<\u002Fcode>, opacity <code>0 → 1<\u002Fcode>, <code>0.3s ease<\u002Fcode>, delayed <code>0.15s<\u002Fcode> so the two overlap by half<\u002Fli>\n<li>Hold <code>3.2s<\u002Fcode> per role; if the label wraps to two lines, stagger them <code>60ms<\u002Fcode> — the same stagger the KPI tiles already use<\u002Fli>\n<li><code>prefers-reduced-motion: reduce<\u002Fcode> → opacity cross-fade at <code>0.2s<\u002Fcode>, no rotation, no perspective<\u002Fli>\n<\u002Ful>\n<p><code>0.3s ease<\u002Fcode> is <code>--d-transition-slow<\u002Fcode>, the system's existing entrance duration. No bounce, no spring, no overshoot.<\u002Fp><\u002Fdiv>\n\n<div class=\"card\"><h3>K mark as the mockup avatar<\u002Fh3>\n<p>Replace the generic avatar placeholder in the rotating chat/phone mockup with the real <code>klassapp-icon.svg<\u002Fcode>. This is <b>Toshi's persistent bot avatar<\u002Fb> — constant across every message and every tool surface, not a per-sender indicator.<\u002Fp>\n<ul>\n<li><b>Use the real avatar class: <code>.toshi-pill-avatar<\u002Fcode><\u002Fb> — 38px, <code>border-radius: 50%<\u002Fcode>, transparent fill, <code>1px var(--d-green)<\u002Fcode> ring, <code>overflow: hidden<\u002Fcode>, with the mark inside at 24px (<code>.toshi-pill-logo<\u002Fcode>). This already exists in the app CSS and is already Toshi's identity treatment, so the mockup should reuse it rather than introduce a new avatar shape.<\u002Fli>\n<li><b>The circle is safe — don't substitute a square.<\u002Fb> Measured, the mark's ink reaches only <code>0.909<\u002Fcode> of its half-width from centre, so at 24px inside a 38px circle it clears the clip by 8.1px, and by 1.7px even drawn edge-to-edge. There is no cropping problem to design around.<\u002Fli>\n<li><b>Set <code>box-sizing: border-box<\u002Fcode>.<\u002Fb> The real class declares <code>width: 38px<\u002Fcode> <i>plus<\u002Fi> a 1px border; it renders 38px total in the app because Tailwind's preflight supplies a global border-box reset. This design-system bundle does not ship Tailwind, so in a bare page the same declaration renders 40px.<\u002Fli>\n<li><code>--d-white<\u002Fcode> fill is <b>not<\u002Fb> used — the real class is transparent, so the bubble or pill colour shows through the ring. Keep it that way.<\u002Fli>\n<li>Inline the SVG rather than <code>&lt;img&gt;<\u002Fcode>, and strip the C2PA <code>&lt;metadata&gt;<\u002Fcode> block: its <code>xmlns:c2pa<\u002Fcode> is declared on the root, so inlining the children alone leaves an unbound prefix and the whole SVG fails to parse. This bit me building the tower.<\u002Fli>\n<\u002Ful><\u002Fdiv>\n\n<\u002Fdiv>\n\n<div class=\"flag\"><h3>Flagged — the hero additions<\u002Fh3>\n<ul>\n<li><b>Superseded — this section is now implemented.<\u002Fb> It was written as a blind spec before any landing-page source existed. The real hero has since been read and built: see <a href=\"../hero-role-rotate/index.html\">concepts/hero-role-rotate/<\u002Fa>, which uses the real <code>#heroRoleStage<\u002Fcode>/<code>#heroRoleDeck<\u002Fcode> markup, the three real role cards, the real <code>1400px<\u002Fcode> perspective, and carries the K mark on all three cards per the settled ruling. <b>Treat that file as the source of truth for the hero; the notes below are kept only for the reasoning behind the flip.<\u002Fb><\u002Fli>\n<li><b>The flip is a new motion primitive.<\u002Fb> There is no <code>perspective<\u002Fcode>, no <code>rotateX/Y<\u002Fcode>, and no 3D transform anywhere in either stylesheet today — the documented vocabulary is a 1px hover lift and a <code>0.97<\u002Fcode> press scale, nothing rotational. Adding a flip is a deliberate extension; keep it in the hero and don't let it become a general pattern without a decision.<\u002Fli>\n<li><b>Avatar semantics — settled.<\u002Fb> The K is <b>Toshi's persistent bot identity<\u002Fb>, the same way any bot's profile picture stays constant regardless of message content. Use it on <b>every<\u002Fb> message instance in the mockup, in whichever tool the user is in (WhatsApp, Drive, Slack). It is <b>not<\u002Fb> a \"who sent this\" indicator, so there is no rule about sender vs recipient bubbles.<\u002Fli>\n<li><b>Reduced motion is unresolved product-wide.<\u002Fb> Neither stylesheet has a <code>prefers-reduced-motion<\u002Fcode> query despite existing looping animations. The guard above is scoped to this hero; the wider gap is still your call.<\u002Fli>\n<\u002Ful><\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fbody><\u002Fhtml>"
  </script>
