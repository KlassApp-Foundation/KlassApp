# =========================
# PRODUCTION
# =========================

# HTTP -> HTTPS SERVER ========= KLASS APP ========
server { 
    listen 80;
    server_name klassapp.xyz www.klassapp.xyz;

    location / {
        return 301 https://$host$request_uri;
    }
}

# =====================================================
# 2. KLASSAPP (LARAVEL) HTTPS SERVER
# =====================================================

    server {
        listen 443 ssl;
        server_name klassapp.xyz www.klassapp.xyz;

        ssl_certificate /etc/letsencrypt/live/klassapp.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/klassapp.xyz/privkey.pem;

        # Security headers
       add_header X-Frame-Options "SAMEORIGIN" always;
       add_header X-Content-Type-Options "nosniff" always;
       add_header Referrer-Policy "strict-origin-when-cross-origin" always;

       root /var/www/public;
       index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    # ========================= MAIN REQUEST HANDLING
        location ~ \.php$ {
            include fastcgi_params;
            # fastcgi_pass sms-app:9000;
            fastcgi_pass sms-app:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~ /\.ht {
            deny all;
        }

         # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    }

